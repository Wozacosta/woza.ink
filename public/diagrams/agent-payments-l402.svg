<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 368" role="img" aria-labelledby="t-agent-payments-l402"><title id="t-agent-payments-l402">The agent requests a resource and gets a 402 with a token and a Lightning invoice. It pays the invoice over Lightning, which reveals a preimage, then retries with the token and preimage. The server checks the preimage against the hash in the token and needs no facilitator</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-agent-payments-l402" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<g data-node="lightning">
<rect x="20" y="14" width="100" height="36" rx="8" class="d-box"/>
<text x="70.0" y="36.5" class="d-t" text-anchor="middle" >Lightning</text>
</g>
<g data-node="agent">
<rect x="150" y="14" width="100" height="36" rx="8" class="d-box"/>
<text x="200.0" y="36.5" class="d-t" text-anchor="middle" >Agent</text>
</g>
<g data-node="server">
<rect x="280" y="14" width="100" height="36" rx="8" class="d-box"/>
<text x="330.0" y="36.5" class="d-t" text-anchor="middle" >Server</text>
</g>
<line x1="70" y1="50" x2="70" y2="358" class="d-line d-faint" stroke-dasharray="4 3"/>
<line x1="200" y1="50" x2="200" y2="358" class="d-line d-faint" stroke-dasharray="4 3"/>
<line x1="330" y1="50" x2="330" y2="358" class="d-line d-faint" stroke-dasharray="4 3"/>
<path d="M202,84 L327.0,84" class="d-line" data-edge="agent-server" marker-end="url(#ah-agent-payments-l402)"/>
<text x="265.0" y="76" class="d-s d-m" text-anchor="middle" data-edge="agent-server">GET /resource</text>
<path d="M328,124 L203.0,124" class="d-line" data-edge="server-agent" marker-end="url(#ah-agent-payments-l402)"/>
<text x="265.0" y="116" class="d-s" text-anchor="middle" data-edge="server-agent">402, token, invoice</text>
<path d="M198,164 L73.0,164" class="d-line" data-edge="agent-lightning" marker-end="url(#ah-agent-payments-l402)"/>
<text x="135.0" y="156" class="d-s" text-anchor="middle" data-edge="agent-lightning">pays the invoice</text>
<path d="M72,204 L197.0,204" class="d-line" data-edge="lightning-agent" marker-end="url(#ah-agent-payments-l402)"/>
<text x="135.0" y="196" class="d-s d-amber d-ct" text-anchor="middle" data-edge="lightning-agent">the preimage</text>
<path d="M202,244 L327.0,244" class="d-line" data-edge="agent-server-paid" marker-end="url(#ah-agent-payments-l402)"/>
<text x="265.0" y="236" class="d-s d-m" text-anchor="middle" data-edge="agent-server-paid">token:preimage</text>
<path d="M328,346 L203.0,346" class="d-line" data-edge="server-agent-paid" marker-end="url(#ah-agent-payments-l402)"/>
<text x="265.0" y="338" class="d-s" text-anchor="middle" data-edge="server-agent-paid">200 and the resource</text>
<g data-node="check">
<rect x="212" y="262" width="168" height="54" rx="6" class="d-box"/>
<text x="296" y="284" class="d-s d-green d-ct" text-anchor="middle" >Preimage matches the hash</text>
<text x="296" y="300" class="d-s" text-anchor="middle" >No facilitator needed</text>
</g>
<path d="M330,248 L330,260" class="d-line" data-edge="server-check" marker-end="url(#ah-agent-payments-l402)"/>
</svg>
