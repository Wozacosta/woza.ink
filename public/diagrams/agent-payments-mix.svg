<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" role="img" aria-labelledby="t-agent-payments-mix"><title id="t-agent-payments-mix">Transactions of 1 dollar or more went from 49 percent of volume in early 2025 to 95 percent by early 2026, while those between 10 cents and 1 dollar fell from 46 percent to 4 percent. The average x402 payer wallet is 197 days old, against 423 days for the rest of Base</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-agent-payments-mix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Share of volume, by payment size</text>
<text x="20" y="50" class="d-s" text-anchor="start" >Early 2025</text>
<rect x="80" y="34" width="147" height="24" class="d-green d-fill" opacity="0.3"/>
<rect x="227" y="34" width="138" height="24" class="d-amber d-fill" opacity="0.3"/>
<rect x="80" y="34" width="300" height="24" class="d-line d-faint"/>
<text x="20" y="84" class="d-s" text-anchor="start" >Early 2026</text>
<rect x="80" y="68" width="285" height="24" class="d-green d-fill" opacity="0.3"/>
<rect x="365" y="68" width="12" height="24" class="d-amber d-fill" opacity="0.3"/>
<rect x="80" y="68" width="300" height="24" class="d-line d-faint"/>
<text x="88" y="51" class="d-t" text-anchor="start" >49%</text>
<text x="88" y="85" class="d-t" text-anchor="start" >95%</text>
<rect x="80" y="110" width="10" height="10" class="d-green d-fill" opacity="0.3"/>
<text x="95" y="119" class="d-s" text-anchor="start" >$1 or more</text>
<rect x="170" y="110" width="10" height="10" class="d-amber d-fill" opacity="0.3"/>
<text x="185" y="119" class="d-s" text-anchor="start" >10¢ to $1</text>
<line x1="20" y1="138" x2="380" y2="138" class="d-line d-faint"/>
<text x="20" y="164" class="d-t" text-anchor="start" >Average wallet age</text>
<text x="20" y="192" class="d-s" text-anchor="start" >x402 payers</text>
<rect x="90" y="176" width="110.32" height="24" rx="3" class="d-blue d-fill" opacity="0.8"/>
<text x="206.32" y="192" class="d-s" text-anchor="start" >197 days</text>
<text x="20" y="226" class="d-s" text-anchor="start" >Rest of Base</text>
<rect x="90" y="210" width="236.88" height="24" rx="3" class="d-head" opacity="0.8"/>
<text x="332.88" y="226" class="d-s" text-anchor="start" >423 days</text>
</svg>
