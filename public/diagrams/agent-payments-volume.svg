<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 294" role="img" aria-labelledby="t-agent-payments-volume"><title id="t-agent-payments-volume">Four sources give 100 million, 165 million, 169 million and 200 million payments, which roughly agree. Dollar volumes drawn to scale do not: 50 billion dollars fills the width and 50 million dollars is a third of a pixel, which is 250 dollars a payment against 30 cents</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-agent-payments-volume" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Payments: roughly the same</text>
<text x="20" y="51" class="d-s" text-anchor="start" >Chainalysis</text>
<rect x="96" y="36" width="120" height="20" rx="3" class="d-blue d-fill" opacity="0.8"/>
<text x="222.0" y="51" class="d-s" text-anchor="start" >100M</text>
<text x="20" y="79" class="d-s" text-anchor="start" >RZLT</text>
<rect x="96" y="64" width="198" height="20" rx="3" class="d-blue d-fill" opacity="0.8"/>
<text x="300.0" y="79" class="d-s" text-anchor="start" >165M</text>
<text x="20" y="107" class="d-s" text-anchor="start" >Coinbase</text>
<rect x="96" y="92" width="202.8" height="20" rx="3" class="d-blue d-fill" opacity="0.8"/>
<text x="304.79999999999995" y="107" class="d-s" text-anchor="start" >169M</text>
<text x="20" y="135" class="d-s" text-anchor="start" >Solana Fdn.</text>
<rect x="96" y="120" width="240" height="20" rx="3" class="d-blue d-fill" opacity="0.8"/>
<text x="342.0" y="135" class="d-s" text-anchor="start" >200M</text>
<line x1="20" y1="160" x2="380" y2="160" class="d-line d-faint"/>
<text x="20" y="186" class="d-t" text-anchor="start" >Dollars: not remotely, drawn to scale</text>
<text x="20" y="210" class="d-s" text-anchor="start" >Solana Foundation</text>
<text x="380" y="210" class="d-s" text-anchor="end" >$50B, or $250 a payment</text>
<rect x="20" y="216" width="360" height="20" rx="3" class="d-rose d-fill" opacity="0.8"/>
<text x="20" y="256" class="d-s" text-anchor="start" >RZLT</text>
<text x="380" y="256" class="d-s" text-anchor="end" >$50M, or $0.30 a payment</text>
<rect x="20" y="262" width="360" height="20" rx="3" class="d-ext"/>
<rect x="20" y="262" width="0.36" height="20" class="d-green d-fill"/>
<text x="30" y="276" class="d-s" text-anchor="start" >the real bar is 0.36px wide, at the left edge</text>
</svg>
