<circle cx="174" cy="142" r="4" class="d-blue d-fill"/>
<text x="186" y="146" class="d-t" text-anchor="start" >Sonarr · Radarr · Lidarr</text>
<text x="186" y="162" class="d-s" text-anchor="start" >want list vs files on disk</text>
<rect x="160" y="232" width="230" height="52" rx="8" class="d-box"/>
<circle cx="174" cy="250" r="4" class="d-green d-fill"/>
<text x="186" y="254" class="d-t" text-anchor="start" >qBittorrent · SABnzbd</text>
<text x="186" y="270" class="d-s" text-anchor="start" >moves the bytes</text>
<rect x="160" y="340" width="230" height="52" rx="8" class="d-box"/>
<circle cx="174" cy="358" r="4" class="d-blue d-fill"/>
<text x="186" y="362" class="d-t" text-anchor="start" >Import</text>
<text x="186" y="378" class="d-s" text-anchor="start" >rename, hardlink into /data/media</text>
<rect x="10" y="412" width="180" height="48" rx="8" class="d-box"/>
<circle cx="24" cy="430" r="4" class="d-rose d-fill"/>
