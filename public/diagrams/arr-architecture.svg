<circle cx="24" cy="142" r="4" class="d-amber d-fill"/>
<text x="36" y="146" class="d-t" text-anchor="start" >Prowlarr</text>
<text x="36" y="162" class="d-s" text-anchor="start" >syncs to apps</text>
