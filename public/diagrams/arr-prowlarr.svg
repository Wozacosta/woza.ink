<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="t-arr-prowlarr"><title id="t-arr-prowlarr">Before Prowlarr every manager configured every indexer; with Prowlarr indexers are configured once and pushed to each manager</title>
