<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-arr-reconcile"><title id="t-arr-reconcile">A reconciliation loop. What you want and what's on disk are compared. If there is a gap, the stack grabs and imports a release, which changes what's on disk, and the comparison runs again</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-arr-reconcile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Declare it, then let the loop run</text>
<text x="20" y="38" class="d-s" text-anchor="start" >The same shape as a controller</text>
<g data-node="want">
<rect x="20" y="54" width="170" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="72" r="4" class="d-violet d-fill"/>
<text x="46" y="76" class="d-t" text-anchor="start" >What you want</text>
<text x="46" y="92" class="d-s" text-anchor="start" >Want list, quality goal</text>
</g>
<g data-node="have">
<rect x="210" y="54" width="160" height="52" rx="8" class="d-box"/>
<circle cx="224" cy="72" r="4" class="d-green d-fill"/>
<text x="236" y="76" class="d-t" text-anchor="start" >What you have</text>
<text x="236" y="92" class="d-s" text-anchor="start" >Files on disk</text>
</g>
<g data-node="compare">
<rect x="20" y="144" width="350" height="46" rx="8" class="d-box"/>
<circle cx="34" cy="162" r="4" class="d-blue d-fill"/>
<text x="46" y="166" class="d-t" text-anchor="start" >Compare</text>
<text x="46" y="182" class="d-s" text-anchor="start" >Every RSS sync, on every new release</text>
</g>
<g data-node="act">
<rect x="20" y="232" width="350" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="250" r="4" class="d-amber d-fill"/>
<text x="46" y="254" class="d-t" text-anchor="start" >Close the gap</text>
<text x="46" y="270" class="d-s" text-anchor="start" >Grab, download, import, or upgrade</text>
</g>
<path d="M105,106 L105,142" class="d-line" data-edge="want-compare" marker-end="url(#ah-arr-reconcile)"/>
<path d="M290,106 L290,142" class="d-line" data-edge="have-compare" marker-end="url(#ah-arr-reconcile)"/>
<path d="M195,190 L195,230" class="d-line" data-edge="compare-act" marker-end="url(#ah-arr-reconcile)"/>
<text x="203" y="214" class="d-s" text-anchor="start" data-edge="compare-act">a gap</text>
<path d="M370,258 L386,258 L386,80 L372,80" class="d-line" data-edge="act-have" marker-end="url(#ah-arr-reconcile)"/>
</svg>
