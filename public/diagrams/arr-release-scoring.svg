<path d="M200,72 L200,96" class="d-line" marker-end="url(#ah-arr-release-scoring)"/>
<rect x="20" y="98" width="360" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="116" r="4" class="d-blue d-fill"/>
<text x="46" y="120" class="d-t" text-anchor="start" >1 · Quality profile</text>
<text x="46" y="136" class="d-s" text-anchor="start" >drop what's not allowed: too small, wrong source, CAM</text>
<path d="M200,150 L200,174" class="d-line" marker-end="url(#ah-arr-release-scoring)"/>
<rect x="20" y="176" width="360" height="128" rx="8" class="d-box"/>
<circle cx="34" cy="194" r="4" class="d-amber d-fill"/>
<text x="46" y="200" class="d-t" text-anchor="start" >2 · Custom formats score what's left</text>
<text x="46" y="222" class="d-s d-m" text-anchor="start" >2160p WEB-DL · DV · Atmos</text>
<text x="364" y="222" class="d-s d-m d-green d-ct" text-anchor="end" >+3100</text>
<text x="46" y="242" class="d-s d-m" text-anchor="start" >1080p WEB-DL · trusted group</text>
<text x="364" y="242" class="d-s d-m" text-anchor="end" >+1750</text>
<text x="46" y="262" class="d-s d-m" text-anchor="start" >1080p WEB-DL · unknown group</text>
<text x="364" y="262" class="d-s d-m" text-anchor="end" >+0</text>
<text x="46" y="282" class="d-s d-m" text-anchor="start" >720p HDTV · re-encode</text>
<text x="364" y="282" class="d-s d-m d-rose d-ct" text-anchor="end" >−10000</text>
<path d="M200,304 L200,328" class="d-line" marker-end="url(#ah-arr-release-scoring)"/>
<rect x="20" y="330" width="360" height="44" rx="8" class="d-box"/>
<circle cx="34" cy="352.0" r="4" class="d-green d-fill"/>
<text x="46" y="356.5" class="d-t" text-anchor="start" >3 · Highest score wins → sent to the download client</text>
<text x="20" y="398" class="d-s" text-anchor="start" >Later, a better release appears? It's grabbed again and replaces</text>
<text x="20" y="413" class="d-s" text-anchor="start" >the file. Upgrades stop once the profile's cutoff is reached.</text>
</svg>
