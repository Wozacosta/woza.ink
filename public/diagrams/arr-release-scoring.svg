<rect x="212" y="36" width="18" height="12" rx="3" class="d-box"/>
<rect x="212" y="52" width="18" height="12" rx="3" class="d-box"/>
<rect x="236" y="36" width="18" height="12" rx="3" class="d-box"/>
<rect x="236" y="52" width="18" height="12" rx="3" class="d-box"/>
<rect x="260" y="36" width="18" height="12" rx="3" class="d-box"/>
