<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 224" role="img" aria-labelledby="t-camera-aperture"><title id="t-camera-aperture">Lens openings to scale at 50 millimeters. A 50mm f/1.8 prime opens to about 28 millimeters. The Z DX 16-50mm kit zoom at f/6.3 opens to about 8 millimeters, so the prime lets in about 12 times the light</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-camera-aperture" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Why a fast prime teaches more</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Openings at 50mm, to scale: focal length / f-number</text>
<circle cx="90" cy="116" r="55.6" class="d-green d-fill" opacity="0.8"/>
<text x="90" y="186" class="d-t" text-anchor="middle" >50mm f/1.8 prime</text>
<text x="90" y="202" class="d-s d-green d-ct" text-anchor="middle" >28 mm across</text>
<circle cx="290" cy="116" r="15.9" class="d-rose d-fill" opacity="0.8"/>
<text x="290" y="186" class="d-t" text-anchor="middle" >Kit zoom at 50mm f/6.3</text>
<text x="290" y="202" class="d-s d-rose d-ct" text-anchor="middle" >8 mm across</text>
<text x="190" y="120" class="d-s" text-anchor="middle" >(6.3 / 1.8)² =</text>
<text x="190" y="136" class="d-t" text-anchor="middle" >12× the light</text>
</svg>
