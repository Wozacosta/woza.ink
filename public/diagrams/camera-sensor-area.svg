<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 218" role="img" aria-labelledby="t-camera-sensor-area"><title id="t-camera-sensor-area">Sensor areas to scale. Full-frame is 864 square millimeters. APS-C is about 345, 2.5 times smaller. Micro Four Thirds is 221, 3.9 times smaller. A 1-inch phone sensor is 116, 7.4 times smaller</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-camera-sensor-area" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >A big phone sensor, to scale</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Area collects the light, so this is the bar that matters</text>
<text x="20" y="62" class="d-t" text-anchor="start" >Full-frame</text>
<text x="380" y="62" class="d-s d-blue d-ct" text-anchor="end" >864 mm²</text>
<rect x="20" y="68" width="360.0" height="14" rx="2" class="d-blue d-fill" opacity="0.8"/>
<text x="20" y="100" class="d-t" text-anchor="start" >APS-C</text>
<text x="380" y="100" class="d-s d-green d-ct" text-anchor="end" >345 mm², 2.5× less light</text>
<rect x="20" y="106" width="143.8" height="14" rx="2" class="d-green d-fill" opacity="0.8"/>
<text x="20" y="138" class="d-t" text-anchor="start" >Micro Four Thirds</text>
<text x="380" y="138" class="d-s d-rose d-ct" text-anchor="end" >221 mm², 3.9× less light</text>
<rect x="20" y="144" width="92.1" height="14" rx="2" class="d-rose d-fill" opacity="0.8"/>
<text x="20" y="176" class="d-t" text-anchor="start" >1-inch phone</text>
<text x="380" y="176" class="d-s d-amber d-ct" text-anchor="end" >116 mm², 7.4× less light</text>
<rect x="20" y="182" width="48.4" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
</svg>
