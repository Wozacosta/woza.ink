<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 216" role="img" aria-labelledby="t-camera-sensors"><title id="t-camera-sensors">Three sensors drawn to scale and centered. Full-frame is 36 by 24 millimeters, APS-C about 23 by 15, and Micro Four Thirds 17 by 13. The smaller ones use only the middle of what a full-frame sensor would see</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-camera-sensors" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Sensor sizes</text>
<text x="20" y="38" class="d-s" text-anchor="start" >To scale. A smaller sensor keeps only the middle of the image.</text>
<rect x="20.0" y="56.0" width="216" height="144" rx="2" class="d-blue d-fill" opacity="0.16"/>
<rect x="20.0" y="56.0" width="216" height="144" rx="2" class="d-line d-blue d-stroke"/>
<circle cx="250" cy="72" r="4" class="d-blue d-fill"/>
<text x="260" y="76" class="d-t" text-anchor="start" >Full-frame</text>
<text x="260" y="92" class="d-s" text-anchor="start" >36 × 24 mm</text>
<rect x="59.0" y="83.0" width="138" height="90" rx="2" class="d-green d-fill" opacity="0.16"/>
<rect x="59.0" y="83.0" width="138" height="90" rx="2" class="d-line d-green d-stroke"/>
<circle cx="250" cy="122" r="4" class="d-green d-fill"/>
<text x="260" y="126" class="d-t" text-anchor="start" >APS-C</text>
<text x="260" y="142" class="d-s" text-anchor="start" >about 23 × 15 mm</text>
<rect x="77.0" y="89.0" width="102" height="78" rx="2" class="d-rose d-fill" opacity="0.16"/>
<rect x="77.0" y="89.0" width="102" height="78" rx="2" class="d-line d-rose d-stroke"/>
<circle cx="250" cy="172" r="4" class="d-rose d-fill"/>
<text x="260" y="176" class="d-t" text-anchor="start" >Micro Four Thirds</text>
<text x="260" y="192" class="d-s" text-anchor="start" >17 × 13 mm</text>
</svg>
