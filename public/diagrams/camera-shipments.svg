<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 148" role="img" aria-labelledby="t-camera-shipments"><title id="t-camera-shipments">Camera shipments in 2025, to scale, from CIPA: 6.31 million mirrorless cameras against 691,000 DSLRs, about nine to one</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-camera-shipments" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >The 2025 shipments, to scale</text>
<text x="20" y="38" class="d-s" text-anchor="start" >CIPA figures, in units</text>
<text x="20" y="60" class="d-t" text-anchor="start" >Mirrorless</text>
<text x="380" y="60" class="d-s d-green d-ct" text-anchor="end" >6.31 million</text>
<rect x="20" y="67" width="360.0" height="16" rx="2" class="d-green d-fill" opacity="0.8"/>
<text x="20" y="102" class="d-t" text-anchor="start" >DSLR</text>
<text x="380" y="102" class="d-s d-rose d-ct" text-anchor="end" >691,000</text>
<rect x="20" y="109" width="39.4" height="16" rx="2" class="d-rose d-fill" opacity="0.8"/>
</svg>
