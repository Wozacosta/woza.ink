<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 356" role="img" aria-labelledby="t-clear-signing-bybit"><title id="t-clear-signing-bybit">A Safe execTransaction has ten parameters. With the Safe descriptor, the enum format turns operation 1 into Delegate Call, and the calldata format looks up the nested call, finds no descriptor for its target and shows it as unknown. The device says Sign multisig operation, Delegate Call, Unknown function, where Bybit's signers saw a hash</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-clear-signing-bybit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Safe execTransaction: ten parameters</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Two of them decide what the device says</text>
<rect x="20.0" y="50" width="32" height="22" rx="4" class="d-box"/>
<rect x="56.4" y="50" width="32" height="22" rx="4" class="d-box"/>
<rect x="92.9" y="50" width="32" height="22" rx="4" class="d-amber d-fill" opacity="0.85"/>
<rect x="129.3" y="50" width="32" height="22" rx="4" class="d-rose d-fill" opacity="0.85"/>
<rect x="165.8" y="50" width="32" height="22" rx="4" class="d-box"/>
<rect x="202.2" y="50" width="32" height="22" rx="4" class="d-box"/>
<rect x="238.6" y="50" width="32" height="22" rx="4" class="d-box"/>
<rect x="275.1" y="50" width="32" height="22" rx="4" class="d-box"/>
<rect x="311.5" y="50" width="32" height="22" rx="4" class="d-box"/>
<rect x="348.0" y="50" width="32" height="22" rx="4" class="d-box"/>
<path d="M106,72 L106,124" class="d-line" marker-end="url(#ah-clear-signing-bybit)"/>
<path d="M145,72 L145,92 L294,92 L294,124" class="d-line" marker-end="url(#ah-clear-signing-bybit)"/>
<text x="98" y="102" class="d-s d-m d-amber d-ct" text-anchor="end" >data</text>
<text x="153" y="86" class="d-s d-m d-rose d-ct" text-anchor="start" >operation = 1</text>
<rect x="20" y="126" width="172" height="68" rx="8" class="d-box"/>
<circle cx="34" cy="144" r="4" class="d-amber d-fill"/>
<text x="46" y="148" class="d-t" text-anchor="start" >calldata format</text>
<text x="46" y="164" class="d-s" text-anchor="start" >Looks up the inner call</text>
<text x="46" y="184" class="d-s" text-anchor="start" >Finds no descriptor</text>
<rect x="208" y="126" width="172" height="68" rx="8" class="d-box"/>
<circle cx="222" cy="144" r="4" class="d-rose d-fill"/>
<text x="234" y="148" class="d-t" text-anchor="start" >enum format</text>
<text x="234" y="164" class="d-s" text-anchor="start" >0 Call, 1 Delegate Call</text>
<text x="234" y="184" class="d-s" text-anchor="start" >Finds Delegate Call</text>
<path d="M106,194 L106,224" class="d-line" marker-end="url(#ah-clear-signing-bybit)"/>
<path d="M294,194 L294,224" class="d-line" marker-end="url(#ah-clear-signing-bybit)"/>
<rect x="20" y="226" width="360" height="94" rx="12" class="d-box"/>
<text x="40" y="252" class="d-t" text-anchor="start" >Sign multisig operation</text>
<text x="40" y="276" class="d-s" text-anchor="start" >Operation type</text>
<text x="136" y="276" class="d-t d-rose d-ct" text-anchor="start" >Delegate Call</text>
<text x="40" y="300" class="d-s" text-anchor="start" >Transaction</text>
<text x="136" y="300" class="d-t d-rose d-ct" text-anchor="start" >Unknown function</text>
<text x="20" y="346" class="d-t" text-anchor="start" >Without the descriptor, this screen was a hash.</text>
</svg>
