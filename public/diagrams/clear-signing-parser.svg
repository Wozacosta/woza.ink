<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 436" role="img" aria-labelledby="t-clear-signing-parser"><title id="t-clear-signing-parser">With plugins, each protocol needs its own firmware-level code on the device, written or reviewed by the wallet maker. With a parser plus data, each protocol publishes a JSON descriptor to a public registry, and any wallet that implements the parser can show all of them</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
