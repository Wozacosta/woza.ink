<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 212" role="img" aria-labelledby="t-clear-signing-template"><title id="t-clear-signing-template">A template in the IDL, Transfer amount to destination. The amount format gives 10 SOL and the account name gives toly.sol, so the wallet shows Transfer 10 SOL to toly.sol</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-clear-signing-template" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-s" text-anchor="start" >In the IDL</text>
<text x="20" y="44" class="d-t d-m" text-anchor="start" >Transfer {amount} to {destination}</text>
<path d="M112,52 L112,78" class="d-line" marker-end="url(#ah-clear-signing-template)"/>
<path d="M192,52 L192,65 L294,65 L294,78" class="d-line" marker-end="url(#ah-clear-signing-template)"/>
<rect x="20" y="80" width="172" height="50" rx="8" class="d-box"/>
<circle cx="34" cy="98" r="4" class="d-blue d-fill"/>
<text x="46" y="102" class="d-t" text-anchor="start" >10 SOL</text>
<text x="46" y="118" class="d-s" text-anchor="start" >decimals and symbol</text>
<rect x="208" y="80" width="172" height="50" rx="8" class="d-box"/>
<circle cx="222" cy="98" r="4" class="d-green d-fill"/>
<text x="234" y="102" class="d-t" text-anchor="start" >toly.sol</text>
<text x="234" y="118" class="d-s" text-anchor="start" >account name</text>
<path d="M106,130 L106,154" class="d-line" marker-end="url(#ah-clear-signing-template)"/>
<path d="M294,130 L294,154" class="d-line" marker-end="url(#ah-clear-signing-template)"/>
<rect x="20" y="156" width="360" height="44" rx="12" class="d-box"/>
<text x="200" y="183" class="d-t" text-anchor="middle" >Transfer 10 SOL to toly.sol</text>
</svg>
