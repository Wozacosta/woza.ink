<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" role="img" aria-labelledby="t-clear-signing-trust"><title id="t-clear-signing-trust">A protocol writes a descriptor and an auditor signs an attestation for it. Both go into a public registry that anyone can mirror. The wallet reads the registry, checks the binding and can require attestations from auditors it trusts</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-clear-signing-trust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<g data-node="protocol">
<rect x="20" y="14" width="172" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="32" r="4" class="d-blue d-fill"/>
<text x="46" y="36" class="d-t" text-anchor="start" >Protocol</text>
<text x="46" y="52" class="d-s" text-anchor="start" >writes a descriptor</text>
</g>
<g data-node="auditor">
<rect x="208" y="14" width="172" height="54" rx="8" class="d-box"/>
<circle cx="222" cy="32" r="4" class="d-violet d-fill"/>
<text x="234" y="36" class="d-t" text-anchor="start" >Auditor</text>
<text x="234" y="52" class="d-s" text-anchor="start" >signs an attestation</text>
</g>
<path d="M106,68 L106,102" class="d-line" data-edge="protocol-registry" marker-end="url(#ah-clear-signing-trust)"/>
<path d="M294,68 L294,102" class="d-line" data-edge="auditor-registry" marker-end="url(#ah-clear-signing-trust)"/>
<g data-node="registry">
<rect x="20" y="104" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="122" r="4" class="d-green d-fill"/>
<text x="46" y="126" class="d-t" text-anchor="start" >Public registry</text>
<text x="46" y="142" class="d-s" text-anchor="start" >387 descriptors from 57 organizations</text>
</g>
<path d="M200,158 L200,192" class="d-line" data-edge="registry-wallet" marker-end="url(#ah-clear-signing-trust)"/>
<text x="210" y="180" class="d-s" text-anchor="start" data-edge="registry-wallet">anyone can mirror it</text>
<g data-node="wallet">
<rect x="20" y="194" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="212" r="4" class="d-amber d-fill"/>
<text x="46" y="216" class="d-t" text-anchor="start" >Wallet</text>
<text x="46" y="232" class="d-s" text-anchor="start" >Checks the binding, can require attestations</text>
</g>
</svg>
