<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 234" role="img" aria-labelledby="t-cmux-attention"><title id="t-cmux-attention">A sketch of one agent run twice. Without rings you keep switching tabs to check on it. With rings you look once, when it calls for you</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-cmux-attention" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >One agent run, two ways to wait</text>
<text x="20" y="38" class="d-s" text-anchor="start" >A sketch, not a measurement</text>
<text x="20" y="64" class="d-t" text-anchor="start" >Without rings</text>
<rect x="20" y="76" width="280" height="14" rx="3" class="d-box"/>
<rect x="302" y="76" width="78" height="14" rx="3" class="d-amber d-fill" opacity="0.8"/>
<text x="20" y="156" class="d-t" text-anchor="start" >With rings</text>
<rect x="20" y="168" width="280" height="14" rx="3" class="d-box"/>
<rect x="302" y="168" width="78" height="14" rx="3" class="d-amber d-fill" opacity="0.8"/>
<text x="160" y="87" class="d-s" text-anchor="middle" >Agent working</text>
<text x="160" y="179" class="d-s" text-anchor="middle" >Agent working</text>
<line x1="44" y1="96" x2="44" y2="108" class="d-rose d-stroke" stroke-width="2" stroke-linecap="round"/>
<line x1="86" y1="96" x2="86" y2="108" class="d-rose d-stroke" stroke-width="2" stroke-linecap="round"/>
<line x1="128" y1="96" x2="128" y2="108" class="d-rose d-stroke" stroke-width="2" stroke-linecap="round"/>
<line x1="170" y1="96" x2="170" y2="108" class="d-rose d-stroke" stroke-width="2" stroke-linecap="round"/>
<line x1="212" y1="96" x2="212" y2="108" class="d-rose d-stroke" stroke-width="2" stroke-linecap="round"/>
<line x1="254" y1="96" x2="254" y2="108" class="d-rose d-stroke" stroke-width="2" stroke-linecap="round"/>
<line x1="296" y1="96" x2="296" y2="108" class="d-rose d-stroke" stroke-width="2" stroke-linecap="round"/>
<text x="20" y="124" class="d-s d-rose d-ct" text-anchor="start" >You keep switching tabs to check</text>
<line x1="300" y1="188" x2="300" y2="200" class="d-green d-stroke" stroke-width="2" stroke-linecap="round"/>
<text x="306" y="216" class="d-s d-green d-ct" text-anchor="end" >Ring: look once</text>
<text x="380" y="68" class="d-s" text-anchor="end" >Needs you</text>
</svg>
