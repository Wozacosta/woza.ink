<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 412" role="img" aria-labelledby="t-cmux-window"><title id="t-cmux-window">A sketch of a cmux window. A sidebar lists four agents with their branch, directory and ports, and shows an unread badge for one of them. That agent's pane has a ring around it, raised by a terminal escape sequence or the cmux CLI, which can also send a macOS notification. A browser pane sits alongside. It's a Swift and AppKit app that renders terminals with libghostty</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-cmux-window" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<rect x="14" y="10" width="372" height="252" rx="8" class="d-line d-faint"/>
<circle cx="28" cy="24" r="3.5" class="d-line d-faint"/>
<circle cx="40" cy="24" r="3.5" class="d-line d-faint"/>
<circle cx="52" cy="24" r="3.5" class="d-line d-faint"/>
<g data-node="sidebar">
<rect x="24" y="38" width="126" height="214" rx="6" class="d-box"/>
<text x="36" y="61.0" class="d-t" text-anchor="start" >Agent 1</text>
<text x="36" y="77.0" class="d-s" text-anchor="start" >branch, dir, ports</text>
<line x1="24" y1="91.5" x2="150" y2="91.5" class="d-line d-faint"/>
<text x="36" y="114.5" class="d-t" text-anchor="start" >Agent 2</text>
<text x="36" y="130.5" class="d-s d-amber d-ct" text-anchor="start" >Waiting for you</text>
<circle cx="136" cy="110.5" r="5" class="d-amber d-fill"/>
<line x1="24" y1="145.0" x2="150" y2="145.0" class="d-line d-faint"/>
<text x="36" y="168.0" class="d-t" text-anchor="start" >Agent 3</text>
<text x="36" y="184.0" class="d-s" text-anchor="start" >branch, dir, ports</text>
<line x1="24" y1="198.5" x2="150" y2="198.5" class="d-line d-faint"/>
<text x="36" y="221.5" class="d-t" text-anchor="start" >Agent 4</text>
<text x="36" y="237.5" class="d-s" text-anchor="start" >branch, dir, ports</text>
</g>
<g data-node="quiet">
<rect x="158" y="38" width="110" height="102" rx="8" class="d-box"/>
<text x="172" y="60" class="d-t" text-anchor="start" >Agent 1</text>
<text x="172" y="76" class="d-s" text-anchor="start" >Still working</text>
<rect x="172" y="92" width="76" height="4" rx="1" class="d-line d-faint"/>
<rect x="172" y="104" width="58" height="4" rx="1" class="d-line d-faint"/>
<rect x="172" y="116" width="68" height="4" rx="1" class="d-line d-faint"/>
</g>
<g data-node="pane">
<rect x="158" y="148" width="110" height="104" rx="8" class="d-box"/>
<rect x="158" y="148" width="110" height="104" rx="8" fill="none" class="d-amber d-stroke" stroke-width="3"/>
<text x="172" y="170" class="d-t" text-anchor="start" >Agent 2</text>
<text x="172" y="186" class="d-s d-amber d-ct" text-anchor="start" >Needs you</text>
<rect x="172" y="202" width="64" height="4" rx="1" class="d-line d-faint"/>
<rect x="172" y="214" width="78" height="4" rx="1" class="d-line d-faint"/>
</g>
<g data-node="browser">
<rect x="276" y="38" width="100" height="214" rx="8" class="d-box"/>
<text x="290" y="60" class="d-t" text-anchor="start" >Browser</text>
<text x="290" y="76" class="d-s" text-anchor="start" >PRs, docs and</text>
<text x="290" y="91" class="d-s" text-anchor="start" >designs beside</text>
<text x="290" y="106" class="d-s" text-anchor="start" >the code</text>
</g>
<g data-node="signal">
<rect x="196" y="288" width="190" height="52" rx="8" class="d-box"/>
<circle cx="210" cy="306" r="4" class="d-violet d-fill"/>
<text x="222" y="310" class="d-t" text-anchor="start" >Escape sequence</text>
<text x="222" y="326" class="d-s" text-anchor="start" >or the cmux CLI</text>
</g>
<g data-node="alert">
<rect x="14" y="288" width="136" height="52" rx="8" class="d-box"/>
<circle cx="28" cy="306" r="4" class="d-blue d-fill"/>
<text x="40" y="310" class="d-t" text-anchor="start" >Desktop alert</text>
<text x="40" y="326" class="d-s" text-anchor="start" >Optional</text>
</g>
<path d="M226,288 L226,254" class="d-line" data-edge="signal-pane" marker-end="url(#ah-cmux-window)"/>
<path d="M196,314 L152,314" class="d-line" data-edge="signal-alert" marker-end="url(#ah-cmux-window)"/>
<g data-node="libghostty">
<rect x="14" y="360" width="180" height="44" rx="8" class="d-box"/>
<circle cx="28" cy="378" r="4" class="d-green d-fill"/>
<text x="40" y="382" class="d-t" text-anchor="start" >libghostty</text>
<text x="40" y="398" class="d-s" text-anchor="start" >Renders the terminal</text>
</g>
<g data-node="native">
<rect x="206" y="360" width="180" height="44" rx="8" class="d-box"/>
<circle cx="220" cy="378" r="4" class="d-green d-fill"/>
<text x="232" y="382" class="d-t" text-anchor="start" >Swift + AppKit</text>
<text x="232" y="398" class="d-s" text-anchor="start" >Native UI, not Electron</text>
</g>
</svg>
