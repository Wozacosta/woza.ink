<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" role="img" aria-labelledby="t-context-handoff"><title id="t-context-handoff">Two sessions side by side. When the window resets, nothing in the first session reaches the second. What crosses is what you wrote to files: the first session writes to them and the second loads them</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-context-handoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Nothing crosses a reset except files</text>
<text x="20" y="38" class="d-s" text-anchor="start" >The agent is stateless, so the state has to live on disk</text>
<g data-node="session1">
<rect x="20" y="60" width="150" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="78" r="4" class="d-violet d-fill"/>
<text x="46" y="82" class="d-t" text-anchor="start" >Session 1</text>
<text x="46" y="98" class="d-s" text-anchor="start" >Chat and decisions</text>
</g>
<g data-node="session2">
<rect x="230" y="60" width="150" height="52" rx="8" class="d-box"/>
<circle cx="244" cy="78" r="4" class="d-blue d-fill"/>
<text x="256" y="82" class="d-t" text-anchor="start" >Session 2</text>
<text x="256" y="98" class="d-s" text-anchor="start" >Starts from scratch</text>
</g>
<line x1="200" y1="50" x2="200" y2="168" class="d-line d-rose d-stroke" stroke-dasharray="4 3"/>
<text x="200" y="184" class="d-s d-rose d-ct" text-anchor="middle" >window resets</text>
<path d="M170,86 L194,86" class="d-line d-faint" data-edge="session1-session2"/>
<text x="200" y="90" class="d-t d-rose d-ct" text-anchor="middle" data-edge="session1-session2">✗</text>
<g data-node="docs">
<rect x="20" y="198" width="360" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="216" r="4" class="d-amber d-fill"/>
<text x="46" y="220" class="d-t" text-anchor="start" >Files on disk</text>
<text x="46" y="236" class="d-s" text-anchor="start" >AGENTS.md, ARCHITECTURE.md, a handoff summary</text>
</g>
<path d="M95,112 L95,196" class="d-line" data-edge="session1-docs" marker-end="url(#ah-context-handoff)"/>
<text x="103" y="150" class="d-s" text-anchor="start" data-edge="session1-docs">write it down</text>
<path d="M305,196 L305,114" class="d-line" data-edge="docs-session2" marker-end="url(#ah-context-handoff)"/>
<text x="297" y="150" class="d-s" text-anchor="end" data-edge="docs-session2">load at the start</text>
</svg>
