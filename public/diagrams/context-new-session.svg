<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 368" role="img" aria-labelledby="t-context-new-session"><title id="t-context-new-session">Four checks in a row. If the task is complete, the conversation has gone sideways, you're switching concerns, or the window feels full, start a new session. If none apply, keep going</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-context-new-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Start fresh, or keep going?</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Any yes means a new session</text>
<g data-node="done">
<rect x="20" y="54" width="200" height="44" rx="8" class="d-box"/>
<text x="34" y="80.5" class="d-t" text-anchor="start" >Task complete?</text>
</g>
<path d="M220,76 L272,76" class="d-line" data-edge="done-fresh" marker-end="url(#ah-context-new-session)"/>
<text x="246" y="69" class="d-s" text-anchor="middle" data-edge="done-fresh">yes</text>
<path d="M120,98 L120,114" class="d-line" data-edge="done-sideways" marker-end="url(#ah-context-new-session)"/>
<g data-node="sideways">
<rect x="20" y="116" width="200" height="44" rx="8" class="d-box"/>
<text x="34" y="142.5" class="d-t" text-anchor="start" >Gone sideways?</text>
</g>
<path d="M220,138 L272,138" class="d-line" data-edge="sideways-fresh" marker-end="url(#ah-context-new-session)"/>
<text x="246" y="131" class="d-s" text-anchor="middle" data-edge="sideways-fresh">yes</text>
<path d="M120,160 L120,176" class="d-line" data-edge="sideways-switching" marker-end="url(#ah-context-new-session)"/>
<g data-node="switching">
<rect x="20" y="178" width="200" height="44" rx="8" class="d-box"/>
<text x="34" y="204.5" class="d-t" text-anchor="start" >Switching concerns?</text>
</g>
<path d="M220,200 L272,200" class="d-line" data-edge="switching-fresh" marker-end="url(#ah-context-new-session)"/>
<text x="246" y="193" class="d-s" text-anchor="middle" data-edge="switching-fresh">yes</text>
<path d="M120,222 L120,238" class="d-line" data-edge="switching-full" marker-end="url(#ah-context-new-session)"/>
<g data-node="full">
<rect x="20" y="240" width="200" height="44" rx="8" class="d-box"/>
<text x="34" y="266.5" class="d-t" text-anchor="start" >Window feels full?</text>
</g>
<path d="M220,262 L272,262" class="d-line" data-edge="full-fresh" marker-end="url(#ah-context-new-session)"/>
<text x="246" y="255" class="d-s" text-anchor="middle" data-edge="full-fresh">yes</text>
<g data-node="fresh">
<rect x="274" y="54" width="106" height="230" rx="8" class="d-box"/>
<circle cx="327" cy="146" r="4" class="d-green d-fill"/>
<text x="327" y="170" class="d-t" text-anchor="middle" >New</text>
<text x="327" y="186" class="d-t" text-anchor="middle" >session</text>
</g>
<g data-node="keep">
<rect x="20" y="312" width="200" height="44" rx="8" class="d-box"/>
<circle cx="34" cy="334.0" r="4" class="d-blue d-fill"/>
<text x="46" y="338.5" class="d-t" text-anchor="start" >Keep going</text>
</g>
<path d="M120,286 L120,310" class="d-line" data-edge="full-keep" marker-end="url(#ah-context-new-session)"/>
<text x="128" y="303" class="d-s" text-anchor="start" data-edge="full-keep">no to all</text>
</svg>
