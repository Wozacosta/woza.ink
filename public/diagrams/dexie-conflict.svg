<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" role="img" aria-labelledby="t-dexie-conflict"><title id="t-dexie-conflict">Two offline devices edit one task. The phone changes the status and the laptop changes the title, and after sync both changes are kept. When both devices change the same field, the last write wins and the other edit is lost</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-dexie-conflict" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Two devices, one task, no network</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Merges work per property, not per record</text>
<text x="20" y="62" class="d-s d-green d-ct" text-anchor="start" >Different fields</text>
<g data-node="phone">
<rect x="20" y="70" width="170" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="88" r="4" class="d-blue d-fill"/>
<text x="46" y="92" class="d-t" text-anchor="start" >Phone</text>
<text x="46" y="108" class="d-s" text-anchor="start" >status: done</text>
</g>
<g data-node="laptop">
<rect x="210" y="70" width="170" height="54" rx="8" class="d-box"/>
<circle cx="224" cy="88" r="4" class="d-violet d-fill"/>
<text x="236" y="92" class="d-t" text-anchor="start" >Laptop</text>
<text x="236" y="108" class="d-s" text-anchor="start" >title: Buy oat milk</text>
</g>
<path d="M105,124 L105,152" class="d-line" data-edge="phone-merged" marker-end="url(#ah-dexie-conflict)"/>
<path d="M295,124 L295,152" class="d-line" data-edge="laptop-merged" marker-end="url(#ah-dexie-conflict)"/>
<g data-node="merged">
<rect x="20" y="154" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="172" r="4" class="d-green d-fill"/>
<text x="46" y="176" class="d-t" text-anchor="start" >Both survive</text>
<text x="46" y="192" class="d-s" text-anchor="start" >title: Buy oat milk, status: done</text>
</g>
<text x="20" y="232" class="d-s d-rose d-ct" text-anchor="start" >Same field</text>
<g data-node="phone2">
<rect x="20" y="240" width="170" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="258" r="4" class="d-blue d-fill"/>
<text x="46" y="262" class="d-t" text-anchor="start" >Phone</text>
<text x="46" y="278" class="d-s" text-anchor="start" >title: Buy milk</text>
</g>
<g data-node="laptop2">
<rect x="210" y="240" width="170" height="54" rx="8" class="d-box"/>
<circle cx="224" cy="258" r="4" class="d-violet d-fill"/>
<text x="236" y="262" class="d-t" text-anchor="start" >Laptop, later</text>
<text x="236" y="278" class="d-s" text-anchor="start" >title: Buy oat milk</text>
</g>
<path d="M190,267 L208,267" class="d-line" data-edge="phone2-laptop2" marker-end="url(#ah-dexie-conflict)"/>
<text x="20" y="318" class="d-t" text-anchor="start" >The last write wins, and the phone's edit is gone.</text>
<text x="20" y="336" class="d-s" text-anchor="start" >Fine for most tasks and notes. Not for shared documents.</text>
</svg>
