<text x="229" y="75" class="d-t" text-anchor="middle" >3</text>
<rect x="268" y="52" width="46" height="36" rx="6" class="d-box"/>
<text x="291" y="75" class="d-t" text-anchor="middle" >4</text>
<rect x="330" y="52" width="46" height="36" rx="6" class="d-box"/>
<text x="353" y="75" class="d-t" text-anchor="middle" >5</text>
<path d="M43,88 L58.5,134" class="d-line" marker-end="url(#ah-dice-mod4)"/>
