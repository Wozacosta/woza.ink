<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" role="img" aria-labelledby="t-dice-rolls"><title id="t-dice-rolls">Bars to scale. Hashing the transcript needs 100 dice rolls for a 256-bit seed, rejection sampling about 192, and binary reduction 256</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-dice-rolls" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Dice rolls for a 256-bit seed</text>
<text x="20" y="38" class="d-s" text-anchor="start" >To scale. A fair die gives about 2.585 bits per roll.</text>
<text x="20" y="68" class="d-t" text-anchor="start" >Hash the transcript</text>
<text x="380" y="68" class="d-s" text-anchor="end" >SHA-256 over every roll</text>
<rect x="20" y="77" width="120.0" height="18" rx="3" class="d-green d-fill" opacity="0.8"/>
<text x="148.0" y="90" class="d-t d-green d-ct" text-anchor="start" >100</text>
<text x="20" y="122" class="d-t" text-anchor="start" >Rejection sampling</text>
<text x="380" y="122" class="d-s" text-anchor="end" >Keep 1–4, reject 5 and 6</text>
<rect x="20" y="131" width="230.39999999999998" height="18" rx="3" class="d-amber d-fill" opacity="0.8"/>
<text x="258.4" y="144" class="d-t d-amber d-ct" text-anchor="start" >192</text>
<text x="20" y="176" class="d-t" text-anchor="start" >Binary reduction</text>
<text x="380" y="176" class="d-s" text-anchor="end" >1–3 is 0, 4–6 is 1</text>
<rect x="20" y="185" width="307.2" height="18" rx="3" class="d-rose d-fill" opacity="0.8"/>
<text x="335.2" y="198" class="d-t d-rose d-ct" text-anchor="start" >256</text>
<line x1="20" y1="226" x2="380" y2="226" class="d-line d-faint"/>
<text x="20" y="250" class="d-s" text-anchor="start" >Doubt your dice? Roll 120 and hash them.</text>
</svg>
