<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 272" role="img" aria-labelledby="t-dotfiles-approaches"><title id="t-dotfiles-approaches">Three approaches. Making the home directory a git repo makes git status noise and lets you commit the wrong file. Manual symlinks take one command per file and are easy to forget. Stow takes one command per package</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-dotfiles-approaches" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Three ways to version a dotfile</text>
<text x="20" y="38" class="d-s" text-anchor="start" >What you type, and what it costs you</text>
<rect x="20" y="52" width="360" height="64" rx="8" class="d-box"/>
<circle cx="34" cy="70" r="4" class="d-rose d-fill"/>
<text x="46" y="74" class="d-t" text-anchor="start" >Make ~ a git repo</text>
<text x="366" y="74" class="d-s d-m" text-anchor="end" >git init ~</text>
<text x="46" y="100" class="d-s d-rose d-ct" text-anchor="start" >git status is noise, easy to commit too much</text>
<rect x="20" y="124" width="360" height="64" rx="8" class="d-box"/>
<circle cx="34" cy="142" r="4" class="d-amber d-fill"/>
<text x="46" y="146" class="d-t" text-anchor="start" >Symlink by hand</text>
<text x="366" y="146" class="d-s d-m" text-anchor="end" >ln -s ~/dotfiles/.zshrc ~/.zshrc</text>
<text x="46" y="172" class="d-s d-amber d-ct" text-anchor="start" >One per file, easy to forget one</text>
<rect x="20" y="196" width="360" height="64" rx="8" class="d-box"/>
<circle cx="34" cy="214" r="4" class="d-green d-fill"/>
<text x="46" y="218" class="d-t" text-anchor="start" >GNU Stow</text>
<text x="366" y="218" class="d-s d-m" text-anchor="end" >stow zsh</text>
<text x="46" y="244" class="d-s d-green d-ct" text-anchor="start" >One command per package</text>
</svg>
