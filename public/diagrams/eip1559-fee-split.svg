<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" role="img" aria-labelledby="t-eip1559-fee-split"><title id="t-eip1559-fee-split">Before 1559 you guessed a gas price in a blind auction and all of it went to miners. After it, your max fee is a ceiling that splits into a base fee, set by the protocol and burned, a priority fee that tips the validator, and an unused part that is refunded</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-eip1559-fee-split" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Before 1559</text>
<rect x="20" y="34" width="360" height="76" rx="8" class="d-box"/>
<text x="34" y="56" class="d-t" text-anchor="start" >You pay: ??? gwei</text>
<text x="34" y="76" class="d-s" text-anchor="start" >Blind auction: guess and hope</text>
<text x="34" y="94" class="d-s d-rose d-ct" text-anchor="start" >100% goes to miners</text>
<text x="20" y="144" class="d-t" text-anchor="start" >After 1559</text>
<rect x="20" y="156" width="190" height="50" rx="5" class="d-violet d-fill" opacity="0.16"/>
<rect x="20" y="156" width="190" height="50" rx="5" class="d-line d-violet d-stroke"/>
<text x="115.0" y="177.0" class="d-t" text-anchor="middle" >Base fee</text>
<text x="115.0" y="193.0" class="d-s" text-anchor="middle" >algorithmic</text>
<rect x="214" y="156" width="96" height="50" rx="5" class="d-green d-fill" opacity="0.16"/>
<rect x="214" y="156" width="96" height="50" rx="5" class="d-line d-green d-stroke"/>
<text x="262.0" y="177.0" class="d-t" text-anchor="middle" >Priority fee</text>
<text x="262.0" y="193.0" class="d-s" text-anchor="middle" >tip</text>
<rect x="314" y="156" width="66" height="50" rx="5" class="d-ext"/>
<text x="347" y="185" class="d-s" text-anchor="middle" >Unused</text>
<text x="115" y="224" class="d-s d-rose d-ct" text-anchor="middle" >Burned: destroyed forever</text>
<text x="262" y="224" class="d-s d-green d-ct" text-anchor="middle" >To the validator</text>
<text x="347" y="224" class="d-s" text-anchor="middle" >Refunded</text>
<path d="M20,234 v6 h360 v-6" class="d-line d-faint"/>
<text x="200" y="258" class="d-s" text-anchor="middle" >Max fee: your ceiling</text>
</svg>
