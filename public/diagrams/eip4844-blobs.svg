<text x="380" y="120" class="d-s" text-anchor="end" >then pruned</text>
<text x="20" y="166" class="d-s" text-anchor="start" >Long enough for fraud proofs and availability checks</text>
<line x1="20" y1="182" x2="380" y2="182" class="d-line d-faint"/>
