<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" role="img" aria-labelledby="t-eip4844-rollups"><title id="t-eip4844-rollups">Before 4844, Arbitrum, Optimism and Base posted data to the L1 block as calldata, expensive and permanent, at about 10 to 50 cents per transaction. After it they post blobs, cheap and pruned after about 18 days, at about a tenth of a cent, 10 to 100 times cheaper</title>
