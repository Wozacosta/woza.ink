<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" role="img" aria-labelledby="t-erc20-approve-flow"><title id="t-erc20-approve-flow">You send the first transaction, approve with an infinite amount, which sets an allowance on the token contract. The DEX sends the second, transferFrom, which spends your allowance</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-erc20-approve-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<g data-node="you">
<rect x="20" y="14" width="100" height="54" rx="8" class="d-box"/>
<text x="70.0" y="36" class="d-t" text-anchor="middle" >You (EOA)</text>
<text x="70.0" y="52" class="d-s" text-anchor="middle" >wallet</text>
</g>
<g data-node="token">
<rect x="140" y="14" width="120" height="54" rx="8" class="d-box"/>
<text x="200.0" y="36" class="d-t" text-anchor="middle" >Token contract</text>
<text x="200.0" y="52" class="d-s" text-anchor="middle" >ERC-20</text>
</g>
<g data-node="dex">
<rect x="280" y="14" width="100" height="54" rx="8" class="d-box"/>
<text x="330.0" y="36" class="d-t" text-anchor="middle" >DEX / DApp</text>
<text x="330.0" y="52" class="d-s" text-anchor="middle" >spender</text>
</g>
<line x1="70" y1="68" x2="70" y2="232" class="d-line d-faint" stroke-dasharray="4 3"/>
<line x1="200" y1="68" x2="200" y2="232" class="d-line d-faint" stroke-dasharray="4 3"/>
<line x1="330" y1="68" x2="330" y2="232" class="d-line d-faint" stroke-dasharray="4 3"/>
<text x="135" y="96" class="d-s" text-anchor="middle" data-edge="you-token">Tx 1, from you</text>
<text x="135" y="114" class="d-s d-m" text-anchor="middle" data-edge="you-token">approve(dex, ∞)</text>
<path d="M72,124 L197,124" class="d-line" data-edge="you-token" marker-end="url(#ah-erc20-approve-flow)"/>
<text x="135" y="140" class="d-s d-blue d-ct" text-anchor="middle" data-edge="you-token">sets allowance</text>
<text x="265" y="168" class="d-s" text-anchor="middle" data-edge="dex-token">Tx 2, from the dex</text>
<text x="265" y="186" class="d-s d-m" text-anchor="middle" data-edge="dex-token">transferFrom(</text>
<text x="265" y="200" class="d-s d-m" text-anchor="middle" data-edge="dex-token">you, dex, amt)</text>
<path d="M328,210 L203,210" class="d-line" data-edge="dex-token" marker-end="url(#ah-erc20-approve-flow)"/>
<text x="265" y="226" class="d-s d-amber d-ct" text-anchor="middle" data-edge="dex-token">spends your allowance</text>
</svg>
