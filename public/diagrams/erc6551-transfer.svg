<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 318" role="img" aria-labelledby="t-erc6551-transfer"><title id="t-erc6551-transfer">Before and after an NFT transfer. The owner of Character NFT 42 changes. The NFT's token bound account, and the sword, gold and POAP inside it, stay exactly as they were</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-erc6551-transfer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Transfer the NFT and the account follows</text>
<text x="20" y="48" class="d-s" text-anchor="start" >Before</text>
<rect x="20" y="56" width="170" height="36" rx="8" class="d-box"/>
<circle cx="34" cy="74.0" r="4" class="d-violet d-fill"/>
<text x="46" y="78.5" class="d-t" text-anchor="start" >You</text>
<path d="M60,92 L60,116" class="d-line" marker-end="url(#ah-erc6551-transfer)"/>
<text x="68" y="108" class="d-s" text-anchor="start" >owns</text>
<rect x="20" y="118" width="170" height="36" rx="8" class="d-box"/>
<text x="34" y="140.5" class="d-t" text-anchor="start" >Character NFT #42</text>
<path d="M60,154 L60,178" class="d-line" marker-end="url(#ah-erc6551-transfer)"/>
<text x="68" y="170" class="d-s" text-anchor="start" >controls</text>
<rect x="20" y="180" width="170" height="92" rx="8" class="d-box"/>
<text x="34" y="202" class="d-t" text-anchor="start" >Token bound account</text>
<text x="34" y="222" class="d-s" text-anchor="start" >Sword NFT</text>
<text x="34" y="238" class="d-s" text-anchor="start" >500 GOLD</text>
<text x="34" y="254" class="d-s" text-anchor="start" >POAP</text>
<text x="210" y="48" class="d-s" text-anchor="start" >After the transfer</text>
<rect x="210" y="56" width="170" height="36" rx="8" class="d-box"/>
<circle cx="224" cy="74.0" r="4" class="d-green d-fill"/>
<text x="236" y="78.5" class="d-t" text-anchor="start" >New owner</text>
<path d="M250,92 L250,116" class="d-line" marker-end="url(#ah-erc6551-transfer)"/>
<text x="258" y="108" class="d-s" text-anchor="start" >owns</text>
<rect x="210" y="118" width="170" height="36" rx="8" class="d-box"/>
<text x="224" y="140.5" class="d-t" text-anchor="start" >Character NFT #42</text>
<path d="M250,154 L250,178" class="d-line" marker-end="url(#ah-erc6551-transfer)"/>
<text x="258" y="170" class="d-s" text-anchor="start" >controls</text>
<rect x="210" y="180" width="170" height="92" rx="8" class="d-box"/>
<text x="224" y="202" class="d-t" text-anchor="start" >Token bound account</text>
<text x="224" y="222" class="d-s" text-anchor="start" >Sword NFT</text>
<text x="224" y="238" class="d-s" text-anchor="start" >500 GOLD</text>
<text x="224" y="254" class="d-s" text-anchor="start" >POAP</text>
<text x="20" y="300" class="d-s" text-anchor="start" >Only the top box changes. Nothing inside the account moves.</text>
</svg>
