<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 438" role="img" aria-labelledby="t-erc8004-registries"><title id="t-erc8004-registries">Your agent meets a stranger and asks three onchain registries three questions. Identity is an ERC-721 NFT, Reputation stores client feedback, and Validation records third-party checks. Heavy data stays offchain, referenced by a URI, with a KECCAK-256 hash on feedback and validation data</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-erc8004-registries" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Should I trust this agent?</text>
<g data-node="client">
<rect x="20" y="34" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="52" r="4" class="d-rose d-fill"/>
<text x="46" y="56" class="d-t" text-anchor="start" >Your agent</text>
<text x="46" y="72" class="d-s" text-anchor="start" >meets a stranger, and claims are cheap</text>
</g>
<rect x="20" y="106" width="360" height="222" rx="8" class="d-ext"/>
<text x="52" y="126" class="d-s" text-anchor="start" >Onchain, one small contract each</text>
<g data-node="identity">
<rect x="52" y="136" width="296" height="54" rx="8" class="d-box"/>
<circle cx="66" cy="154" r="4" class="d-blue d-fill"/>
<text x="78" y="158" class="d-t" text-anchor="start" >Identity</text>
<text x="78" y="174" class="d-s" text-anchor="start" >Who are you? An ERC-721 NFT per agent</text>
</g>
<path d="M36,88 L36,163 L50,163" class="d-line" data-edge="client-identity" marker-end="url(#ah-erc8004-registries)"/>
<path d="M348,163 L364,163 L364,370" class="d-line" data-edge="identity-offchain" marker-end="url(#ah-erc8004-registries)"/>
<g data-node="reputation">
<rect x="52" y="198" width="296" height="54" rx="8" class="d-box"/>
<circle cx="66" cy="216" r="4" class="d-green d-fill"/>
<text x="78" y="220" class="d-t" text-anchor="start" >Reputation</text>
<text x="78" y="236" class="d-s" text-anchor="start" >What's your track record? Client feedback</text>
</g>
<path d="M36,88 L36,225 L50,225" class="d-line" data-edge="client-reputation" marker-end="url(#ah-erc8004-registries)"/>
<path d="M348,225 L364,225 L364,370" class="d-line" data-edge="reputation-offchain" marker-end="url(#ah-erc8004-registries)"/>
<g data-node="validation">
<rect x="52" y="260" width="296" height="54" rx="8" class="d-box"/>
<circle cx="66" cy="278" r="4" class="d-violet d-fill"/>
<text x="78" y="282" class="d-t" text-anchor="start" >Validation</text>
<text x="78" y="298" class="d-s" text-anchor="start" >Can a third party verify it? Stake, zkML, TEE</text>
</g>
<path d="M36,88 L36,287 L50,287" class="d-line" data-edge="client-validation" marker-end="url(#ah-erc8004-registries)"/>
<path d="M348,287 L364,287 L364,370" class="d-line" data-edge="validation-offchain" marker-end="url(#ah-erc8004-registries)"/>
<text x="356" y="354" class="d-s" text-anchor="end" >a URI, with a KECCAK-256 hash on the last two</text>
<g data-node="offchain">
<rect x="20" y="372" width="360" height="54" rx="8" class="d-ext"/>
<text x="34" y="394" class="d-t" text-anchor="start" >Offchain</text>
<text x="34" y="410" class="d-s" text-anchor="start" >Registration file, feedback, validation evidence</text>
</g>
</svg>
