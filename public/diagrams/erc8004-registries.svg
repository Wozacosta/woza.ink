<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" role="img" aria-labelledby="t-erc8004-registries"><title id="t-erc8004-registries">Three onchain registries answer three questions about an agent. Identity is an ERC-721 NFT, Reputation stores client feedback, and Validation records third-party checks. Heavy data stays offchain, referenced by a URI and a KECCAK-256 hash</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-erc8004-registries" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Should I trust this agent?</text>
<rect x="20" y="36" width="360" height="222" rx="8" class="d-ext"/>
<text x="34" y="56" class="d-s" text-anchor="start" >Onchain, one small contract each</text>
<rect x="34" y="66" width="332" height="54" rx="8" class="d-box"/>
<circle cx="48" cy="84" r="4" class="d-blue d-fill"/>
<text x="60" y="88" class="d-t" text-anchor="start" >Identity</text>
<text x="60" y="104" class="d-s" text-anchor="start" >Who are you? An ERC-721 NFT per agent</text>
<rect x="34" y="128" width="332" height="54" rx="8" class="d-box"/>
<circle cx="48" cy="146" r="4" class="d-green d-fill"/>
<text x="60" y="150" class="d-t" text-anchor="start" >Reputation</text>
<text x="60" y="166" class="d-s" text-anchor="start" >What's your track record? Client feedback</text>
<rect x="34" y="190" width="332" height="54" rx="8" class="d-box"/>
<circle cx="48" cy="208" r="4" class="d-violet d-fill"/>
<text x="60" y="212" class="d-t" text-anchor="start" >Validation</text>
<text x="60" y="228" class="d-s" text-anchor="start" >Can a third party verify it? Stake, zkML, TEE</text>
<path d="M200,258 L200,300" class="d-line" marker-end="url(#ah-erc8004-registries)"/>
<text x="210" y="283" class="d-s" text-anchor="start" >a URI and a KECCAK-256 hash</text>
<rect x="20" y="302" width="360" height="54" rx="8" class="d-ext"/>
<text x="34" y="324" class="d-t" text-anchor="start" >Offchain</text>
<text x="34" y="340" class="d-s" text-anchor="start" >Agent registration file, validation evidence</text>
</svg>
