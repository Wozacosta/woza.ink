<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 214" role="img" aria-labelledby="t-eth-standards-layers"><title id="t-eth-standards-layers">Three layers stacked on each other. ERC-20 at the bottom gives you DeFi. EIP-1559 and EIP-4844 on top of it make DeFi cheap. ERC-4337 and EIP-7702 on top of that let you onboard normal users</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-eth-standards-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<rect x="100" y="14" width="200" height="54" rx="8" class="d-box"/>
<circle cx="114" cy="32" r="4" class="d-amber d-fill"/>
<text x="126" y="36" class="d-t" text-anchor="start" >Normal users</text>
<text x="126" y="52" class="d-s" text-anchor="start" >ERC-4337, EIP-7702</text>
<rect x="60" y="76" width="280" height="54" rx="8" class="d-box"/>
<circle cx="74" cy="94" r="4" class="d-green d-fill"/>
<text x="86" y="98" class="d-t" text-anchor="start" >Cheap DeFi</text>
<text x="86" y="114" class="d-s" text-anchor="start" >EIP-1559, EIP-4844</text>
<rect x="20" y="138" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="156" r="4" class="d-violet d-fill"/>
<text x="46" y="160" class="d-t" text-anchor="start" >DeFi</text>
<text x="46" y="176" class="d-s" text-anchor="start" >ERC-20</text>
</svg>
