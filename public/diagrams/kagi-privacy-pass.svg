<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" role="img" aria-labelledby="t-kagi-privacy-pass"><title id="t-kagi-privacy-pass">Privacy Pass in two phases. First your browser proves it is a member, with its session cookie, and generates tokens with Kagi. Later it sends a query with one token. Kagi can tell the token is valid, but can't link it back to the first phase</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-kagi-privacy-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Prove you paid, then search as nobody</text>
<text x="20" y="46" class="d-s" text-anchor="start" >Now and then: generate tokens</text>
<g data-node="client">
<rect x="20" y="54" width="130" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="72" r="4" class="d-blue d-fill"/>
<text x="46" y="76" class="d-t" text-anchor="start" >Your browser</text>
<text x="46" y="92" class="d-s" text-anchor="start" >Extension or Orion</text>
</g>
<g data-node="kagi">
<rect x="250" y="54" width="130" height="54" rx="8" class="d-box"/>
<circle cx="264" cy="72" r="4" class="d-violet d-fill"/>
<text x="276" y="76" class="d-t" text-anchor="start" >Kagi</text>
<text x="276" y="92" class="d-s" text-anchor="start" >Sees your account</text>
</g>
<path d="M150,72 L248,72" class="d-line" data-edge="client-kagi" marker-end="url(#ah-kagi-privacy-pass)"/>
<text x="200" y="66" class="d-s" text-anchor="middle" data-edge="client-kagi">session cookie</text>
<path d="M250,92 L152,92" class="d-line" data-edge="kagi-client" marker-end="url(#ah-kagi-privacy-pass)"/>
<text x="200" y="104" class="d-s" text-anchor="middle" data-edge="kagi-client">tokens</text>
<line x1="20" y1="136" x2="380" y2="136" class="d-line d-rose d-stroke" stroke-dasharray="4 3"/>
<text x="200" y="154" class="d-s d-rose d-ct" text-anchor="middle" >Kagi can't connect these two phases</text>
<text x="20" y="182" class="d-s" text-anchor="start" >Each search: spend one token</text>
<g data-node="search">
<rect x="20" y="190" width="130" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="208" r="4" class="d-blue d-fill"/>
<text x="46" y="212" class="d-t" text-anchor="start" >Your browser</text>
<text x="46" y="228" class="d-s" text-anchor="start" >No session cookie</text>
</g>
<g data-node="kagi2">
<rect x="250" y="190" width="130" height="54" rx="8" class="d-box"/>
<circle cx="264" cy="208" r="4" class="d-green d-fill"/>
<text x="276" y="212" class="d-t" text-anchor="start" >Kagi</text>
<text x="276" y="228" class="d-s" text-anchor="start" >Sees a valid token</text>
</g>
<path d="M150,208 L248,208" class="d-line" data-edge="search-kagi2" marker-end="url(#ah-kagi-privacy-pass)"/>
<text x="200" y="202" class="d-s" text-anchor="middle" data-edge="search-kagi2">query + token</text>
<path d="M250,228 L152,228" class="d-line" data-edge="kagi2-search" marker-end="url(#ah-kagi-privacy-pass)"/>
<text x="200" y="240" class="d-s" text-anchor="middle" data-edge="kagi2-search">results</text>
<line x1="20" y1="262" x2="380" y2="262" class="d-line d-faint"/>
<text x="20" y="286" class="d-t" text-anchor="start" >Each token works once, then a fresh one is used.</text>
<text x="20" y="304" class="d-s" text-anchor="start" >It unlinks the account. Kagi still reads the query.</text>
</svg>
