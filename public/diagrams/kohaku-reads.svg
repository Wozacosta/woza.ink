<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" role="img" aria-labelledby="t-kohaku-reads"><title id="t-kohaku-reads">Four approaches to reading the chain, and the one problem each solves. A light client proves the answer is right. Tor hides your IP. TEE plus ORAM and PIR hide the question, the first by trusting Intel's hardware and the second with cryptography alone</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-kohaku-reads" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Four read fixes, one problem each</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Filled: the problem it's built to solve</text>
<text x="206" y="66" class="d-s" text-anchor="middle" >Validity</text>
<text x="270" y="66" class="d-s" text-anchor="middle" >Your IP</text>
<text x="338" y="66" class="d-s" text-anchor="middle" >Your question</text>
<rect x="20" y="76" width="360" height="46" rx="8" class="d-box"/>
<text x="34" y="96" class="d-t" text-anchor="start" >Light client</text>
<text x="34" y="112" class="d-s" text-anchor="start" >Helios and Colibri</text>
<circle cx="206" cy="99" r="7" class="d-green d-fill"/>
<circle cx="270" cy="99" r="6" class="d-line d-faint"/>
<circle cx="338" cy="99" r="6" class="d-line d-faint"/>
<rect x="20" y="130" width="360" height="46" rx="8" class="d-box"/>
<text x="34" y="150" class="d-t" text-anchor="start" >Tor</text>
<text x="34" y="166" class="d-s" text-anchor="start" >Browser-only for now</text>
<circle cx="206" cy="153" r="6" class="d-line d-faint"/>
<circle cx="270" cy="153" r="7" class="d-green d-fill"/>
<circle cx="338" cy="153" r="6" class="d-line d-faint"/>
<rect x="20" y="184" width="360" height="46" rx="8" class="d-box"/>
<text x="34" y="204" class="d-t" text-anchor="start" >TEE plus ORAM</text>
<text x="34" y="220" class="d-s" text-anchor="start" >Trusts Intel's hardware</text>
<circle cx="206" cy="207" r="6" class="d-line d-faint"/>
<circle cx="270" cy="207" r="6" class="d-line d-faint"/>
<circle cx="338" cy="207" r="7" class="d-green d-fill"/>
<rect x="20" y="238" width="360" height="46" rx="8" class="d-box"/>
<text x="34" y="258" class="d-t" text-anchor="start" >PIR</text>
<text x="34" y="274" class="d-s" text-anchor="start" >Cryptography alone</text>
<circle cx="206" cy="261" r="6" class="d-line d-faint"/>
<circle cx="270" cy="261" r="6" class="d-line d-faint"/>
<circle cx="338" cy="261" r="7" class="d-green d-fill"/>
