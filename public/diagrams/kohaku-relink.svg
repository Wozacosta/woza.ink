<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-kohaku-relink"><title id="t-kohaku-relink">After a shielded withdrawal nothing onchain links the old address and the fresh one. But the wallet then asks one RPC for both balances from one IP, so that server can link them anyway</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-kohaku-relink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >After a shielded withdrawal</text>
<rect x="20" y="36" width="120" height="44" rx="8" class="d-box"/>
<text x="80.0" y="62.5" class="d-t" text-anchor="middle" >Old address</text>
<rect x="260" y="36" width="120" height="44" rx="8" class="d-box"/>
<text x="320.0" y="62.5" class="d-t" text-anchor="middle" >Fresh address</text>
<line x1="142" y1="58" x2="258" y2="58" class="d-line d-faint" stroke-dasharray="3 4"/>
<text x="200" y="52" class="d-s d-green d-ct" text-anchor="middle" >no link onchain</text>
<path d="M80,80 L80,126" class="d-line" marker-end="url(#ah-kohaku-relink)"/>
<path d="M320,80 L320,126" class="d-line" marker-end="url(#ah-kohaku-relink)"/>
<rect x="20" y="128" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="146" r="4" class="d-blue d-fill"/>
<text x="46" y="150" class="d-t" text-anchor="start" >Your wallet</text>
<text x="46" y="166" class="d-s" text-anchor="start" >Checks both balances</text>
<path d="M200,182 L200,228" class="d-line" marker-end="url(#ah-kohaku-relink)"/>
<text x="210" y="209" class="d-s" text-anchor="start" >one IP, both addresses</text>
<rect x="20" y="230" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="248" r="4" class="d-rose d-fill"/>
<text x="46" y="252" class="d-t" text-anchor="start" >The RPC</text>
<text x="46" y="268" class="d-s" text-anchor="start" >Sees that the two go together</text>
</svg>
