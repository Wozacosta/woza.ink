<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="t-kohaku-today"><title id="t-kohaku-today">The four leaks and how far Kohaku had got on November 1, 2026. Dapp: one address per dapp is on the roadmap. RPC: light client adapters exist and private reads are experimental. Broadcast: direct P2P sending is on the roadmap. Chain: Privacy Pools and Tornado Cash plugins are alpha, and Railgun is a placeholder</title>
