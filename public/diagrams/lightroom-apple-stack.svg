<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 226" role="img" aria-labelledby="t-lightroom-apple-stack"><title id="t-lightroom-apple-stack">Photomator sits directly on Apple's own layers: SwiftUI for the interface, Core ML for its machine learning, Metal for the graphics chip, and Apple silicon with its Neural Engine underneath</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-lightroom-apple-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >One app, one vendor's stack</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Each layer below it comes from Apple</text>
<rect x="20" y="54" width="360" height="34" rx="6" class="d-amber d-fill" opacity="0.25"/>
<rect x="20" y="54" width="360" height="34" rx="6" class="d-line d-amber d-stroke"/>
<text x="34" y="76" class="d-t" text-anchor="start" >Photomator</text>
<rect x="20" y="94" width="360" height="26" rx="4" class="d-box"/>
<text x="34" y="111.5" class="d-t" text-anchor="start" >SwiftUI</text>
<text x="366" y="111.5" class="d-s" text-anchor="end" >The interface</text>
<rect x="20" y="124" width="360" height="26" rx="4" class="d-box"/>
<text x="34" y="141.5" class="d-t" text-anchor="start" >Core ML</text>
<text x="366" y="141.5" class="d-s" text-anchor="end" >The auto-adjustments</text>
<rect x="20" y="154" width="360" height="26" rx="4" class="d-box"/>
<text x="34" y="171.5" class="d-t" text-anchor="start" >Metal</text>
<text x="366" y="171.5" class="d-s" text-anchor="end" >The graphics chip</text>
<rect x="20" y="184" width="360" height="26" rx="4" class="d-box"/>
<text x="34" y="201.5" class="d-t" text-anchor="start" >Apple silicon</text>
<text x="366" y="201.5" class="d-s" text-anchor="end" >Includes the Neural Engine</text>
</svg>
