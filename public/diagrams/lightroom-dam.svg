<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 256" role="img" aria-labelledby="t-lightroom-dam"><title id="t-lightroom-dam">Three ways to manage photos. A catalog has strong search but ties you to the software. Folders and sidecar files are portable but weaker at search. Cloud libraries work anywhere but depend on the service, and migration is painful. Ratings are a sketch</title>
