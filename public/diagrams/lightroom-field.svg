<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" role="img" aria-labelledby="t-lightroom-field"><title id="t-lightroom-field">Ten photo tools. All run on Mac. All but Photomator run on Windows. Only darktable, RawTherapee and digiKam run on Linux, and those three are free. Affinity is free too. Lightroom is a subscription, and the rest can be bought once</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-lightroom-field" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Where each tool runs, and how you pay</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Only the open-source tools reach Linux</text>
<text x="186" y="62" class="d-s" text-anchor="middle" >Mac</text>
<text x="222" y="62" class="d-s" text-anchor="middle" >Win</text>
<text x="260" y="62" class="d-s" text-anchor="middle" >Linux</text>
<text x="380" y="62" class="d-s" text-anchor="end" >Cost</text>
<line x1="20" y1="71" x2="380" y2="71" class="d-line d-faint"/>
<text x="20" y="88" class="d-t" text-anchor="start" >Lightroom</text>
