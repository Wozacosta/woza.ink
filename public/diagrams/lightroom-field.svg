<circle cx="222" cy="84" r="5" class="d-rose d-fill"/>
<circle cx="260" cy="84" r="4.5" class="d-line d-faint"/>
<text x="380" y="88" class="d-s d-rose d-ct" text-anchor="end" >$19.99 a month</text>
<line x1="20" y1="97" x2="380" y2="97" class="d-line d-faint"/>
<text x="20" y="114" class="d-t" text-anchor="start" >Capture One</text>
