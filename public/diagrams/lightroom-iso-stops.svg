<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 214" role="img" aria-labelledby="t-lightroom-iso-stops"><title id="t-lightroom-iso-stops">Bars to scale for ISO 1600, 3200, 6400 and 12800, each double the last. A file shot at ISO 12800 and cleaned two to three stops better looks like one shot at ISO 3200 to 1600</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-lightroom-iso-stops" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >What two or three stops buy</text>
<text x="20" y="38" class="d-s" text-anchor="start" >One stop is a doubling, so the bars double</text>
<rect x="20" y="58" width="360.0" height="22" rx="2" class="d-rose d-fill" opacity="0.8"/>
<text x="30" y="73" class="d-t" text-anchor="start" style="fill:var(--background,#faf8f5)">ISO 12800</text>
<rect x="20" y="92" width="180.0" height="22" rx="2" class="d-line d-faint" style="fill:var(--line-strong,#cfc8bc)"/>
<text x="208.0" y="107" class="d-s" text-anchor="start" >ISO 6400</text>
<rect x="20" y="126" width="90.0" height="22" rx="2" class="d-green d-fill" opacity="0.8"/>
<text x="118.0" y="141" class="d-s" text-anchor="start" >ISO 3200</text>
<rect x="20" y="160" width="45.0" height="22" rx="2" class="d-green d-fill" opacity="0.8"/>
<text x="73.0" y="175" class="d-s" text-anchor="start" >ISO 1600</text>
<path d="M196,126 h10 v56 h-10" class="d-line"/>
<text x="216" y="150" class="d-s" text-anchor="start" >Reads like this after</text>
<text x="216" y="166" class="d-t d-green d-ct" text-anchor="start" >DeepPRIME XD3</text>
</svg>
