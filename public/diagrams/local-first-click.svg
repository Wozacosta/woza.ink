<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 266" role="img" aria-labelledby="t-local-first-click"><title id="t-local-first-click">A sketch of one click. In a cloud-first app the click goes over the network, a spinner shows until the server answers, and if the network fails the app stops. In a local-first app the local write is done at once, and sync follows later in the background</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-local-first-click" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >One click, two waits</text>
<text x="20" y="38" class="d-s" text-anchor="start" >A sketch, not a measurement</text>
<text x="20" y="66" class="d-t" text-anchor="start" >Cloud-first</text>
<rect x="20" y="76" width="44" height="28" rx="4" class="d-blue d-fill" opacity="0.85"/>
<rect x="66" y="76" width="264" height="28" rx="4" class="d-rose d-fill" opacity="0.25"/>
<rect x="332" y="76" width="48" height="28" rx="4" class="d-green d-fill" opacity="0.85"/>
<text x="42" y="120" class="d-s" text-anchor="middle" >Click</text>
<text x="198" y="95" class="d-s" text-anchor="middle" >Spinner, while the network decides</text>
<text x="356" y="120" class="d-s" text-anchor="middle" >Update</text>
<line x1="20" y1="138" x2="380" y2="138" class="d-line d-faint"/>
<text x="20" y="164" class="d-t" text-anchor="start" >Local-first</text>
<rect x="20" y="174" width="44" height="28" rx="4" class="d-blue d-fill" opacity="0.85"/>
<rect x="66" y="174" width="48" height="28" rx="4" class="d-green d-fill" opacity="0.85"/>
<rect x="116" y="174" width="264" height="28" rx="4" class="d-ext"/>
<text x="42" y="218" class="d-s" text-anchor="middle" >Click</text>
<text x="90" y="218" class="d-s" text-anchor="middle" >Update</text>
<text x="248" y="193" class="d-s" text-anchor="middle" >Sync, whenever it can</text>
<text x="20" y="250" class="d-s" text-anchor="start" >Only the top row makes anyone wait.</text>
</svg>
