<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="t-local-first-flow"><title id="t-local-first-flow">On your device the UI reads and writes a local IndexedDB database through Dexie, so updates are instant. In the background DexieCloud syncs changes to a cloud database, and other devices pull them</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-local-first-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<rect x="20" y="16" width="360" height="112" rx="8" class="d-ext"/>
<text x="34" y="36" class="d-s" text-anchor="start" >Your device</text>
<rect x="34" y="48" width="124" height="64" rx="8" class="d-box"/>
<circle cx="48" cy="66" r="4" class="d-green d-fill"/>
<text x="60" y="70" class="d-t" text-anchor="start" >UI</text>
<text x="60" y="86" class="d-s" text-anchor="start" >Updates at once</text>
<rect x="242" y="48" width="124" height="64" rx="8" class="d-box"/>
<circle cx="256" cy="66" r="4" class="d-blue d-fill"/>
<text x="268" y="70" class="d-t" text-anchor="start" >Local database</text>
<text x="268" y="86" class="d-s" text-anchor="start" >IndexedDB, Dexie</text>
<path d="M158,72 L240,72" class="d-line" marker-end="url(#ah-local-first-flow)"/>
<text x="199" y="66" class="d-s" text-anchor="middle" >writes</text>
<path d="M242,92 L160,92" class="d-line" marker-end="url(#ah-local-first-flow)"/>
<text x="201" y="106" class="d-s" text-anchor="middle" >reads</text>
<path d="M304,128 L304,170" class="d-line" stroke-dasharray="4 3" marker-end="url(#ah-local-first-flow)"/>
<text x="294" y="153" class="d-s" text-anchor="end" >background sync</text>
<rect x="208" y="172" width="172" height="54" rx="8" class="d-box"/>
<circle cx="222" cy="190" r="4" class="d-violet d-fill"/>
<text x="234" y="194" class="d-t" text-anchor="start" >DexieCloud</text>
<text x="234" y="210" class="d-s" text-anchor="start" >An eventual replica</text>
<path d="M208,199 L154,199" class="d-line" stroke-dasharray="4 3" marker-end="url(#ah-local-first-flow)"/>
<rect x="20" y="172" width="132" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="190" r="4" class="d-amber d-fill"/>
<text x="46" y="194" class="d-t" text-anchor="start" >Other devices</text>
<text x="46" y="210" class="d-s" text-anchor="start" >Pull the changes</text>
<line x1="20" y1="246" x2="380" y2="246" class="d-line d-faint"/>
<text x="20" y="270" class="d-t" text-anchor="start" >Cut the network and the top box keeps working.</text>
<text x="20" y="288" class="d-s" text-anchor="start" >The device is the source of truth. The cloud is a replica,</text>
<text x="20" y="304" class="d-s" text-anchor="start" >not the gatekeeper.</text>
</svg>
