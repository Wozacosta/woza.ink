<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" role="img" aria-labelledby="t-matrix-id"><title id="t-matrix-id">A Matrix ID compared with an email address. In alice@example.com and @alice:example.com, alice is the user and example.com is the server that holds the account</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-matrix-id" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >You can already read this address</text>
<text x="20" y="68" class="d-s" text-anchor="start" >Email</text>
<text x="96" y="70" class="d-m" style="font-size:18px"><tspan class="d-blue d-ct">alice</tspan><tspan style="fill:var(--subtle,#6b665f)">@</tspan><tspan class="d-green d-ct">example.com</tspan></text>
<text x="20" y="120" class="d-s" text-anchor="start" >Matrix</text>
<text x="96" y="122" class="d-m" style="font-size:18px"><tspan style="fill:var(--subtle,#6b665f)">@</tspan><tspan class="d-blue d-ct">alice</tspan><tspan style="fill:var(--subtle,#6b665f)">:</tspan><tspan class="d-green d-ct">example.com</tspan></text>
<path d="M106.8,128 v5 H160.8 v-5" class="d-line d-faint"/>
<text x="133.8" y="150" class="d-s d-blue d-ct" text-anchor="middle" >the user</text>
<path d="M171.60000000000002,128 v5 H290.40000000000003 v-5" class="d-line d-faint"/>
<text x="171.60000000000002" y="150" class="d-s d-green d-ct" text-anchor="start" >the server with the account</text>
<text x="20" y="182" class="d-s" text-anchor="start" >Different servers can talk, the way two mail hosts can.</text>
</svg>
