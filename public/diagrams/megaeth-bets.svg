<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 238" role="img" aria-labelledby="t-megaeth-bets"><title id="t-megaeth-bets">Three approaches to a fast chain. MegaETH bets on one sequencer and raw sequential speed, settled on Ethereum. Monad runs parallel EVM execution across decentralized validators, giving up some throughput ceiling. Solana is already fast and already has liquidity</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-megaeth-bets" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Three answers to the same problem</text>
<rect x="20" y="36" width="360" height="58" rx="8" class="d-box"/>
<circle cx="34" cy="55" r="4" class="d-green d-fill"/>
<text x="46" y="59" class="d-t" text-anchor="start" >MegaETH</text>
<text x="368" y="59" class="d-s d-green d-ct" text-anchor="end" >Settles on Ethereum</text>
<text x="46" y="78" class="d-s" text-anchor="start" >One sequencer, raw sequential speed</text>
<rect x="20" y="102" width="360" height="58" rx="8" class="d-box"/>
<circle cx="34" cy="121" r="4" class="d-violet d-fill"/>
<text x="46" y="125" class="d-t" text-anchor="start" >Monad</text>
<text x="368" y="125" class="d-s d-violet d-ct" text-anchor="end" >Lower throughput ceiling</text>
<text x="46" y="144" class="d-s" text-anchor="start" >Parallel EVM, decentralized validators</text>
<rect x="20" y="168" width="360" height="58" rx="8" class="d-box"/>
<circle cx="34" cy="187" r="4" class="d-amber d-fill"/>
<text x="46" y="191" class="d-t" text-anchor="start" >Solana</text>
<text x="368" y="191" class="d-s d-amber d-ct" text-anchor="end" >Its own L1</text>
<text x="46" y="210" class="d-s" text-anchor="start" >Already fast, already has liquidity</text>
</svg>
