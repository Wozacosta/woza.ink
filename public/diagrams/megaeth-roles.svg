<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 388" role="img" aria-labelledby="t-megaeth-roles"><title id="t-megaeth-roles">A typical node does everything. MegaETH splits the roles: one sequencer orders and executes every transaction, provers re-execute blocks to produce proofs, full nodes re-execute every transaction to check it themselves, and replica nodes apply state diffs without re-executing and serve reads</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-megaeth-roles" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<g data-node="typical">
<rect x="20" y="16" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="34" r="4" class="d-rose d-fill"/>
<text x="46" y="38" class="d-t" text-anchor="start" >Typical node</text>
<text x="46" y="54" class="d-s" text-anchor="start" >Executes, stores state, runs consensus, broadcasts</text>
</g>
<path d="M200,70 L200,104" class="d-line" data-edge="typical-sequencer" marker-end="url(#ah-megaeth-roles)"/>
<text x="210" y="91" class="d-s" text-anchor="start" data-edge="typical-sequencer">MegaETH splits that up</text>
<g data-node="sequencer">
<rect x="20" y="106" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="124" r="4" class="d-blue d-fill"/>
<text x="46" y="128" class="d-t" text-anchor="start" >Sequencer</text>
<text x="46" y="144" class="d-s" text-anchor="start" >One high-spec machine runs every transaction</text>
</g>
<line x1="44" y1="160" x2="44" y2="344" class="d-line"/>
<g data-node="provers">
<rect x="70" y="178" width="310" height="54" rx="8" class="d-box"/>
<circle cx="84" cy="196" r="4" class="d-amber d-fill"/>
<text x="96" y="200" class="d-t" text-anchor="start" >Provers</text>
<text x="96" y="216" class="d-s" text-anchor="start" >Re-execute blocks and prove the results</text>
</g>
<path d="M44,205 L68,205" class="d-line" data-edge="sequencer-provers" marker-end="url(#ah-megaeth-roles)"/>
<g data-node="full">
<rect x="70" y="244" width="310" height="54" rx="8" class="d-box"/>
<circle cx="84" cy="262" r="4" class="d-green d-fill"/>
<text x="96" y="266" class="d-t" text-anchor="start" >Full nodes</text>
<text x="96" y="282" class="d-s" text-anchor="start" >Re-execute every transaction themselves</text>
</g>
<path d="M44,271 L68,271" class="d-line" data-edge="sequencer-full" marker-end="url(#ah-megaeth-roles)"/>
<g data-node="replicas">
<rect x="70" y="310" width="310" height="54" rx="8" class="d-box"/>
<circle cx="84" cy="328" r="4" class="d-violet d-fill"/>
<text x="96" y="332" class="d-t" text-anchor="start" >Replica nodes</text>
<text x="96" y="348" class="d-s" text-anchor="start" >Apply state diffs, serve RPC and indexers</text>
</g>
<path d="M44,337 L68,337" class="d-line" data-edge="sequencer-replicas" marker-end="url(#ah-megaeth-roles)"/>
<text x="20" y="378" class="d-s" text-anchor="start" >One machine does the work. Everyone else checks it or reads it.</text>
</svg>
