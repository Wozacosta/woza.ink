<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="t-megaeth-roles"><title id="t-megaeth-roles">A typical node does everything. MegaETH splits the roles: one sequencer executes every transaction, full nodes verify its results without re-executing, and replica nodes stream state diffs to serve reads</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-megaeth-roles" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<rect x="20" y="16" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="34" r="4" class="d-rose d-fill"/>
<text x="46" y="38" class="d-t" text-anchor="start" >Typical node</text>
<text x="46" y="54" class="d-s" text-anchor="start" >Executes, stores state, runs consensus, broadcasts</text>
<path d="M200,70 L200,104" class="d-line" marker-end="url(#ah-megaeth-roles)"/>
<text x="210" y="91" class="d-s" text-anchor="start" >MegaETH splits that up</text>
<rect x="20" y="106" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="124" r="4" class="d-blue d-fill"/>
<text x="46" y="128" class="d-t" text-anchor="start" >Sequencer</text>
<text x="46" y="144" class="d-s" text-anchor="start" >One high-spec machine runs every transaction</text>
<path d="M106,160 L106,210" class="d-line" marker-end="url(#ah-megaeth-roles)"/>
<text x="116" y="189" class="d-s" text-anchor="start" >results</text>
<path d="M294,160 L294,210" class="d-line" marker-end="url(#ah-megaeth-roles)"/>
<text x="304" y="189" class="d-s" text-anchor="start" >state diffs</text>
<rect x="20" y="212" width="172" height="64" rx="8" class="d-box"/>
<circle cx="34" cy="230" r="4" class="d-green d-fill"/>
<text x="46" y="234" class="d-t" text-anchor="start" >Full nodes</text>
<text x="46" y="250" class="d-s" text-anchor="start" >Verify, don't re-execute</text>
<text x="46" y="266" class="d-s" text-anchor="start" >Modest hardware</text>
<rect x="208" y="212" width="172" height="64" rx="8" class="d-box"/>
<circle cx="222" cy="230" r="4" class="d-violet d-fill"/>
<text x="234" y="234" class="d-t" text-anchor="start" >Replica nodes</text>
<text x="234" y="250" class="d-s" text-anchor="start" >Serve RPC and indexers</text>
<text x="234" y="266" class="d-s" text-anchor="start" >No verification work</text>
<line x1="20" y1="294" x2="380" y2="294" class="d-line d-faint"/>
<text x="20" y="318" class="d-s" text-anchor="start" >One machine does the work. Everyone else checks it or reads it.</text>
</svg>
