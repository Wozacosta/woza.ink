<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-labelledby="t-megaeth-slots"><title id="t-megaeth-slots">One Ethereum block of about 12 seconds drawn as a grid of 1,200 cells. Each cell is one MegaETH mini-block of about 10 milliseconds. A 250 millisecond Arbitrum block fills 25 cells and a 2 second Optimism block fills 200</title>
