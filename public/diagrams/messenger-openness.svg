<text x="20" y="149" class="d-s" text-anchor="start" >Server</text>
<rect x="96" y="120" width="134" height="50" rx="8" class="d-box"/>
<circle cx="110" cy="145.0" r="4" class="d-green d-fill"/>
<text x="122" y="149.5" class="d-t" text-anchor="start" >Open source</text>
<rect x="238" y="120" width="142" height="50" rx="8" class="d-box"/>
<circle cx="252" cy="145.0" r="4" class="d-rose d-fill"/>
