<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="t-multisig-correlated"><title id="t-multisig-correlated">Three keys look like three independent risks, but keys in one house share a fire, keys in one password manager share a breach, and keys held by three co-founders share a falling-out. One event can take them all</title>
