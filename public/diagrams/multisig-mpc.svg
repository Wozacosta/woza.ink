<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="t-multisig-mpc"><title id="t-multisig-mpc">In multisig, n separate keys each produce a signature and the blockchain enforces the threshold, so it rejects an under-signed transaction. In MPC, one key is split into n shares, an off-chain signing protocol enforces the threshold, and the chain sees one ordinary signature, so it can't catch a broken or compromised protocol</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-multisig-mpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Multisig</text>
<text x="20" y="38" class="d-s" text-anchor="start" >n separate keys</text>
<text x="210" y="22" class="d-t" text-anchor="start" >MPC / TSS</text>
<text x="210" y="38" class="d-s" text-anchor="start" >One key, split into n shares</text>
<rect x="20" y="52" width="50" height="28" rx="8" class="d-box"/>
<text x="45.0" y="70.5" class="d-t" text-anchor="middle" >key</text>
<rect x="210" y="52" width="50" height="28" rx="8" class="d-box"/>
<text x="235.0" y="70.5" class="d-t" text-anchor="middle" >share</text>
<path d="M45,80 L45,204" class="d-line" marker-end="url(#ah-multisig-mpc)"/>
<path d="M235,80 L259.0,110" class="d-line" marker-end="url(#ah-multisig-mpc)"/>
<rect x="80" y="52" width="50" height="28" rx="8" class="d-box"/>
<text x="105.0" y="70.5" class="d-t" text-anchor="middle" >key</text>
<rect x="270" y="52" width="50" height="28" rx="8" class="d-box"/>
<text x="295.0" y="70.5" class="d-t" text-anchor="middle" >share</text>
<path d="M105,80 L105,204" class="d-line" marker-end="url(#ah-multisig-mpc)"/>
<path d="M295,80 L295.0,110" class="d-line" marker-end="url(#ah-multisig-mpc)"/>
<rect x="140" y="52" width="50" height="28" rx="8" class="d-box"/>
<text x="165.0" y="70.5" class="d-t" text-anchor="middle" >key</text>
<rect x="330" y="52" width="50" height="28" rx="8" class="d-box"/>
<text x="355.0" y="70.5" class="d-t" text-anchor="middle" >share</text>
<path d="M165,80 L165,204" class="d-line" marker-end="url(#ah-multisig-mpc)"/>
<path d="M355,80 L331.0,110" class="d-line" marker-end="url(#ah-multisig-mpc)"/>
<path d="M295,164 L295,204" class="d-line" marker-end="url(#ah-multisig-mpc)"/>
<text x="287" y="181" class="d-s" text-anchor="end" >one signature</text>
<line x1="20" y1="186" x2="380" y2="186" class="d-line d-faint" stroke-dasharray="3 4"/>
<text x="380" y="180" class="d-s" text-anchor="end" >off-chain</text>
<text x="380" y="200" class="d-s" text-anchor="end" >on-chain</text>
<text x="75" y="136" class="d-s" text-anchor="middle" >signs</text>
<rect x="210" y="112" width="170" height="52" rx="8" class="d-box d-violet"/>
<rect x="210" y="112" width="170" height="52" rx="8" class="d-violet d-fill" opacity="0.1"/>
<text x="224" y="134" class="d-t" text-anchor="start" >Signing protocol</text>
<text x="224" y="150" class="d-s d-violet d-ct" text-anchor="start" >The rule lives here</text>
<rect x="20" y="206" width="170" height="52" rx="8" class="d-box d-violet"/>
<rect x="20" y="206" width="170" height="52" rx="8" class="d-violet d-fill" opacity="0.1"/>
<text x="34" y="228" class="d-t" text-anchor="start" >The blockchain</text>
<text x="34" y="244" class="d-s d-violet d-ct" text-anchor="start" >The rule lives here</text>
<rect x="210" y="206" width="170" height="52" rx="8" class="d-box"/>
<text x="224" y="228" class="d-t" text-anchor="start" >The blockchain</text>
<text x="224" y="244" class="d-s" text-anchor="start" >Sees an ordinary signature</text>
<text x="20" y="282" class="d-s d-green d-ct" text-anchor="start" >Rejects an under-signed</text>
<text x="20" y="298" class="d-s d-green d-ct" text-anchor="start" >transaction by consensus</text>
<text x="210" y="282" class="d-s d-rose d-ct" text-anchor="start" >Nothing here catches a broken</text>
<text x="210" y="298" class="d-s d-rose d-ct" text-anchor="start" >or compromised protocol</text>
</svg>
