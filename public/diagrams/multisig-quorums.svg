<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 276" role="img" aria-labelledby="t-multisig-quorums"><title id="t-multisig-quorums">Compared with one key, 1-of-2 lets you lose a key but is easier to steal from. 3-of-3 needs three stolen keys but one lost key is fatal. 2-of-3 is the smallest setup that improves both: a thief needs two keys and you can lose one</title>
