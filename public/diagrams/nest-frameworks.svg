<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 264" role="img" aria-labelledby="t-nest-frameworks"><title id="t-nest-frameworks">A table of six options. Express is minimal with no opinions. Fastify is faster and also works as a NestJS adapter. Hono runs everywhere and suits edge functions. tRPC gives end-to-end types and is a protocol layer. Elysia is Bun-native and very fast. NestJS brings structure and suits big teams and long-lived projects</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-nest-frameworks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Where NestJS sits</text>
<text x="20" y="38" class="d-s" text-anchor="start" >What each one is, and when it wins</text>
<text x="20" y="62" class="d-s" text-anchor="start" >Option</text>
<text x="92" y="62" class="d-s" text-anchor="start" >What it is</text>
<text x="232" y="62" class="d-s" text-anchor="start" >Wins when</text>
<line x1="20" y1="70" x2="380" y2="70" class="d-line d-faint"/>
<text x="20" y="92" class="d-t" text-anchor="start" >Express</text>
<text x="92" y="92" class="d-s" text-anchor="start" >Minimal, no opinions</text>
<text x="232" y="92" class="d-s" text-anchor="start" >You build your own</text>
<line x1="20" y1="103" x2="380" y2="103" class="d-line d-faint"/>
<text x="20" y="122" class="d-t" text-anchor="start" >Fastify</text>
<text x="92" y="122" class="d-s" text-anchor="start" >Faster, plugin system</text>
<text x="232" y="122" class="d-s" text-anchor="start" >Also a Nest adapter</text>
<line x1="20" y1="133" x2="380" y2="133" class="d-line d-faint"/>
<text x="20" y="152" class="d-t" text-anchor="start" >Hono</text>
<text x="92" y="152" class="d-s" text-anchor="start" >Runs everywhere</text>
<text x="232" y="152" class="d-s" text-anchor="start" >Edge, small APIs</text>
<line x1="20" y1="163" x2="380" y2="163" class="d-line d-faint"/>
<text x="20" y="182" class="d-t" text-anchor="start" >tRPC</text>
<text x="92" y="182" class="d-s" text-anchor="start" >End-to-end types</text>
<text x="232" y="182" class="d-s" text-anchor="start" >You own both ends</text>
<line x1="20" y1="193" x2="380" y2="193" class="d-line d-faint"/>
<text x="20" y="212" class="d-t" text-anchor="start" >Elysia</text>
<text x="92" y="212" class="d-s" text-anchor="start" >Bun-native, very fast</text>
<text x="232" y="212" class="d-s" text-anchor="start" >You're on Bun</text>
<rect x="12" y="224" width="376" height="28" rx="6" class="d-box"/>
<text x="20" y="242" class="d-t" text-anchor="start" >NestJS</text>
<text x="92" y="242" class="d-s" text-anchor="start" >Modules, DI, structure</text>
<text x="232" y="242" class="d-s" text-anchor="start" >Big team, long life</text>
</svg>
