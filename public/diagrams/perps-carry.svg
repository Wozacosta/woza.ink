<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 246" role="img" aria-labelledby="t-perps-carry"><title id="t-perps-carry">Buying one bitcoin on spot and shorting one bitcoin perp cancels the price exposure and leaves the funding payments, with several risks</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-perps-carry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<rect x="20" y="20" width="172" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="38" r="4" class="d-green d-fill"/>
<text x="46" y="42" class="d-t" text-anchor="start" >Long 1 BTC spot</text>
<text x="46" y="58" class="d-s" text-anchor="start" >gains if the price rises</text>
<rect x="20" y="92" width="172" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="110" r="4" class="d-rose d-fill"/>
<text x="46" y="114" class="d-t" text-anchor="start" >Short 1 BTC perp</text>
<text x="46" y="130" class="d-s" text-anchor="start" >gains if the price falls</text>
<rect x="244" y="56" width="136" height="52" rx="8" class="d-box"/>
<circle cx="258" cy="74" r="4" class="d-blue d-fill"/>
<text x="270" y="78" class="d-t" text-anchor="start" >Flat on price</text>
<text x="270" y="94" class="d-s" text-anchor="start" >keeps the funding</text>
<path d="M192,46 L218,46 L218,82 L242,82" class="d-line" marker-end="url(#ah-perps-carry)"/>
<path d="M192,118 L218,118 L218,82 L242,82" class="d-line" marker-end="url(#ah-perps-carry)"/>
<line x1="20" y1="166" x2="380" y2="166" class="d-line d-faint"/>
<text x="20" y="188" class="d-s" text-anchor="start" >Baseline funding of 0.01% every 8 hours is about 11% a year</text>
<text x="20" y="206" class="d-s" text-anchor="start" >It breaks if funding turns negative, the exchange fails, or</text>
<text x="20" y="222" class="d-s" text-anchor="start" >the short leg is auto-deleveraged and leaves you long</text>
</svg>
