<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 356" role="img" aria-labelledby="t-perps-expiry"><title id="t-perps-expiry">A dated future is forced to meet the spot price at expiry. A perp has no expiry, so funding pulls it back: above the index longs pay shorts, below it shorts pay longs</title>
