<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 164" role="img" aria-labelledby="t-perps-usde"><title id="t-perps-usde">During the crash USDe fell to 65 cents on Binance's own order book while staying around 99 cents on Curve and Uniswap. Binance's unified accounts valued margin at the lower price</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-perps-usde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >One dollar token, two prices</text>
<text x="20" y="38" class="d-s" text-anchor="start" >USDe during the crash, to scale from $0 to $1</text>
<text x="20" y="58" class="d-s" text-anchor="start" >Curve, Uniswap</text>
<rect x="20" y="65" width="297.0" height="20" rx="3" class="d-green d-fill" opacity="0.8"/>
<text x="325.0" y="80" class="d-t d-green d-ct" text-anchor="start" >$0.99</text>
<text x="20" y="106" class="d-s" text-anchor="start" >Binance</text>
<rect x="20" y="113" width="195.0" height="20" rx="3" class="d-rose d-fill" opacity="0.8"/>
<text x="223.0" y="128" class="d-t d-rose d-ct" text-anchor="start" >$0.65</text>
<text x="20" y="154" class="d-s" text-anchor="start" >Cross-margined accounts were valued at the lower bar.</text>
</svg>
