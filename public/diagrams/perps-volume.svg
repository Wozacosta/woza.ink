<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 142" role="img" aria-labelledby="t-perps-volume"><title id="t-perps-volume">Crypto trading volume in 2025, to scale: perpetual futures about 61.8 trillion dollars, spot about 18.6 trillion dollars</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-perps-volume" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Crypto volume in 2025</text>
<text x="20" y="38" class="d-s" text-anchor="start" >To scale. CryptoQuant's figures.</text>
<rect x="20" y="56" width="360.0" height="30" rx="3" class="d-blue d-fill" opacity="0.8"/>
<text x="372.0" y="75" class="d-t" text-anchor="end" style="fill:var(--background,#faf8f5)">Perps $61.8T</text>
<rect x="20" y="98" width="108.3" height="30" rx="3" class="d-amber d-fill" opacity="0.8"/>
<text x="136.34951456310682" y="117" class="d-t d-amber d-ct" text-anchor="start" >Spot $18.6T</text>
</svg>
