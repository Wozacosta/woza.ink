<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" role="img" aria-labelledby="t-perps-waterfall"><title id="t-perps-waterfall">When a position fails it first goes to the order book, then a backstop such as an insurance fund or liquidator vault, and finally auto-deleveraging closes profitable traders on the other side</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-perps-waterfall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<g data-node="trigger">
<rect x="20" y="16" width="262" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="34" r="4" class="d-blue d-fill"/>
<text x="46" y="38" class="d-t" text-anchor="start" >Equity below maintenance</text>
<text x="46" y="54" class="d-s" text-anchor="start" >measured at the mark price</text>
</g>
<path d="M64,68 L64,108" class="d-line" data-edge="trigger-book" marker-end="url(#ah-perps-waterfall)"/>
<text x="74" y="92" class="d-s" text-anchor="start" data-edge="trigger-book">liquidation starts</text>
<g data-node="book">
<rect x="20" y="110" width="262" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="128" r="4" class="d-green d-fill"/>
<text x="46" y="132" class="d-t" text-anchor="start" >Market orders to the book</text>
<text x="46" y="148" class="d-s" text-anchor="start" >almost always the end of it</text>
</g>
<text x="296" y="132" class="d-s d-green d-ct" text-anchor="start" >absorbed</text>
<text x="296" y="147" class="d-s d-green d-ct" text-anchor="start" >→ done</text>
<path d="M64,162 L64,202" class="d-line" data-edge="book-backstop" marker-end="url(#ah-perps-waterfall)"/>
<text x="74" y="186" class="d-s" text-anchor="start" data-edge="book-backstop">the book can't absorb it</text>
<g data-node="backstop">
<rect x="20" y="204" width="262" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="222" r="4" class="d-amber d-fill"/>
<text x="46" y="226" class="d-t" text-anchor="start" >Backstop</text>
<text x="46" y="242" class="d-s" text-anchor="start" >insurance fund or liquidator vault</text>
</g>
<text x="296" y="226" class="d-s d-green d-ct" text-anchor="start" >absorbed</text>
<text x="296" y="241" class="d-s d-green d-ct" text-anchor="start" >→ done</text>
<path d="M64,256 L64,296" class="d-line" data-edge="backstop-adl" marker-end="url(#ah-perps-waterfall)"/>
<text x="74" y="280" class="d-s" text-anchor="start" data-edge="backstop-adl">the backstop runs out</text>
<g data-node="adl">
<rect x="20" y="298" width="262" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="316" r="4" class="d-rose d-fill"/>
<text x="46" y="320" class="d-t" text-anchor="start" >Auto-deleveraging</text>
<text x="46" y="336" class="d-s" text-anchor="start" >winners on the other side are closed</text>
</g>
<text x="20" y="374" class="d-s" text-anchor="start" >Each step moves the loss further from the trader who took the risk.</text>
</svg>
