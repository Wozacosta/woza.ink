<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 264" role="img" aria-labelledby="t-perps-weekend"><title id="t-perps-weekend">A sketch. While the reference market is shut for the weekend the index stops updating and the perp trades on its own flow. When the market reopens the price can move in one jump, past a long's liquidation price</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-perps-weekend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >A perp on Sunday</text>
<text x="20" y="38" class="d-s" text-anchor="start" >A sketch, not data</text>
<rect x="120" y="56" width="180" height="170" class="d-amber d-fill" opacity="0.12"/>
<text x="210.0" y="72" class="d-s d-amber d-ct" text-anchor="middle" >reference market shut</text>
<line x1="20" y1="170" x2="380" y2="170" class="d-line d-rose d-stroke" stroke-dasharray="4 3"/>
<text x="20" y="186" class="d-s d-rose d-ct" text-anchor="start" >long's liquidation</text>
<text x="20" y="100" class="d-s d-blue d-ct" text-anchor="start" >perp</text>
<text x="20" y="136" class="d-s" text-anchor="start" >index</text>
<path d="M20.0,115.0 L24.0,114.9 L28.0,114.5 L32.0,113.9 L36.0,113.1 L40.0,112.2 L44.0,111.3 L48.0,110.4 L52.0,109.7 L56.0,109.2 L60.0,109.0 L64.0,109.1 L68.0,109.4 L72.0,110.0 L76.0,110.7 L80.0,111.6 L84.0,112.5 L88.0,113.4 L92.0,114.1 L96.0,114.7 L100.0,115.0 L104.0,115.0 L108.0,114.7 L112.0,114.2 L116.0,113.4 L120.0,112.6" class="d-line d-blue d-stroke"/>
