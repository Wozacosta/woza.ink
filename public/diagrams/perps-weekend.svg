<line x1="120" y1="117.6" x2="300" y2="117.6" class="d-line" stroke-dasharray="4 3"/>
<text x="210" y="150" class="d-s" text-anchor="middle" >index frozen, perp on its own flow</text>
<path d="M300.0,127.5 L304.0,200.0 L308.0,200.8 L312.0,199.7 L316.0,198.7 L320.0,197.8 L324.0,197.2 L328.0,197.0 L332.0,197.2 L336.0,197.7 L340.0,198.5 L344.0,199.6 L348.0,200.7 L352.0,201.7 L356.0,202.4 L360.0,202.9 L364.0,203.0 L368.0,202.7 L372.0,202.0 L376.0,201.1 L380.0,200.0" class="d-line d-blue d-stroke"/>
<circle cx="302" cy="170" r="4" class="d-rose d-fill"/>
<text x="380" y="222" class="d-s" text-anchor="end" >reopens lower</text>
<text x="20" y="250" class="d-s" text-anchor="start" >Friday close</text>
<text x="210" y="250" class="d-s" text-anchor="middle" >Sunday</text>
<text x="380" y="250" class="d-s" text-anchor="end" >Monday open</text>
</svg>
