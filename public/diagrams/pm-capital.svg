<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 276" role="img" aria-labelledby="t-pm-capital"><title id="t-pm-capital">Vitalik's 2020 trade, to scale. Trump supporters offset his position with about 60,000 dollars. He bet 308,249 DAI to earn 56,803 dollars, and needed around a million dollars of capital to do it</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-pm-capital" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >What correcting the price cost</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Vitalik's 2020 trade, to scale</text>
<text x="20" y="62" class="d-s" text-anchor="start" >Capital tied up</text>
<text x="380" y="62" class="d-s d-rose d-ct" text-anchor="end" >about $1,000,000</text>
<rect x="20" y="69" width="360.0" height="20" rx="3" class="d-rose d-fill" opacity="0.8"/>
<text x="20" y="112" class="d-s" text-anchor="start" >His bet</text>
<text x="380" y="112" class="d-s d-amber d-ct" text-anchor="end" >308,249 DAI</text>
<rect x="20" y="119" width="111.0" height="20" rx="3" class="d-amber d-fill" opacity="0.8"/>
<text x="20" y="162" class="d-s" text-anchor="start" >His profit</text>
<text x="380" y="162" class="d-s d-green d-ct" text-anchor="end" >$56,803</text>
<rect x="20" y="169" width="20.4" height="20" rx="3" class="d-green d-fill" opacity="0.8"/>
<text x="20" y="212" class="d-s" text-anchor="start" >What offset his bet</text>
<text x="380" y="212" class="d-s d-violet d-ct" text-anchor="end" >about $60,000</text>
<rect x="20" y="219" width="21.6" height="20" rx="3" class="d-violet d-fill" opacity="0.8"/>
<text x="20" y="266" class="d-s" text-anchor="start" >Locked for about two months.</text>
</svg>
