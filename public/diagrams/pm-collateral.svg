<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 208" role="img" aria-labelledby="t-pm-collateral"><title id="t-pm-collateral">A sketch of a position held for months. Bare USDC stays flat, so being right late still loses against a savings account. Collateral in TYD grows at about a lending rate while the bet is open</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-pm-collateral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Holding a position while you wait</text>
<text x="20" y="38" class="d-s" text-anchor="start" >A sketch, not a rate</text>
<line x1="30" y1="60" x2="30" y2="176" class="d-line d-faint"/>
<path d="M30,160 L370,72" class="d-line d-green d-stroke" style="stroke-width:2"/>
<path d="M30,160 L370,160" class="d-line d-rose d-stroke" style="stroke-width:2"/>
<text x="370" y="62" class="d-s d-green d-ct" text-anchor="end" >TYD: earns about a lending rate</text>
<text x="370" y="152" class="d-s d-rose d-ct" text-anchor="end" >Bare USDC: zero</text>
<text x="30" y="190" class="d-s" text-anchor="start" >Deposit</text>
<text x="370" y="190" class="d-s" text-anchor="end" >Resolution</text>
</svg>
