<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 134" role="img" aria-labelledby="t-pm-hedge"><title id="t-pm-hedge">Vitalik's hedging idea as a flow. A local AI looks at what you spend money on and builds a basket of positions that pays out when those costs rise</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-pm-hedge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >A market as insurance</text>
<rect x="20" y="40" width="108" height="64" rx="8" class="d-box"/>
<circle cx="34" cy="58" r="4" class="d-blue d-fill"/>
<text x="44" y="62" class="d-t" text-anchor="start" >Your</text>
<text x="44" y="77" class="d-t" text-anchor="start" >spending</text>
<text x="34" y="95" class="d-s" text-anchor="start" >what it costs you</text>
<path d="M128,72 L144,72" class="d-line" marker-end="url(#ah-pm-hedge)"/>
<rect x="146" y="40" width="108" height="64" rx="8" class="d-box"/>
<circle cx="160" cy="58" r="4" class="d-violet d-fill"/>
<text x="170" y="62" class="d-t" text-anchor="start" >Local AI</text>
<text x="160" y="95" class="d-s" text-anchor="start" >builds a basket</text>
<path d="M254,72 L270,72" class="d-line" marker-end="url(#ah-pm-hedge)"/>
<rect x="272" y="40" width="108" height="64" rx="8" class="d-box"/>
<circle cx="286" cy="58" r="4" class="d-green d-fill"/>
<text x="296" y="62" class="d-t" text-anchor="start" >Positions</text>
<text x="286" y="95" class="d-s" text-anchor="start" >pay if costs rise</text>
</svg>
