<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" role="img" aria-labelledby="t-pm-oracles"><title id="t-pm-oracles">Polymarket with UMA next to Trueo. Polymarket's rules can gain a clarification after trading starts; Trueo's are fixed on-chain at creation. Polymarket's disputes go straight to a UMA token vote; Trueo's go to a five-member council first. UMA holders have the last word on Polymarket, eleven random attesters on Trueo. Collateral is plain USDC on one and yield-bearing TYD on the other</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-pm-oracles" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="112" y="22" class="d-t" text-anchor="start" >Polymarket + UMA</text>
<text x="256" y="22" class="d-t" text-anchor="start" >Trueo</text>
<rect x="20" y="34" width="360" height="40" rx="8" class="d-box"/>
<text x="32" y="58" class="d-s" text-anchor="start" >Rules</text>
<text x="112" y="58" class="d-s d-rose d-ct" text-anchor="start" >Clarified after outcomes</text>
<text x="256" y="58" class="d-s d-green d-ct" text-anchor="start" >Fixed at creation</text>
<rect x="20" y="80" width="360" height="40" rx="8" class="d-box"/>
<text x="32" y="104" class="d-s" text-anchor="start" >Proposal</text>
<text x="112" y="104" class="d-s d-rose d-ct" text-anchor="start" >Bonded, then a window</text>
<text x="256" y="104" class="d-s d-green d-ct" text-anchor="start" >250 TYD, 12 hours</text>
<rect x="20" y="126" width="360" height="40" rx="8" class="d-box"/>
<text x="32" y="150" class="d-s" text-anchor="start" >Dispute</text>
<text x="112" y="150" class="d-s d-rose d-ct" text-anchor="start" >UMA token vote</text>
<text x="256" y="150" class="d-s d-green d-ct" text-anchor="start" >Council of 5 first</text>
<rect x="20" y="172" width="360" height="40" rx="8" class="d-box"/>
<text x="32" y="196" class="d-s" text-anchor="start" >Last word</text>
<text x="112" y="196" class="d-s d-rose d-ct" text-anchor="start" >UMA holders</text>
<text x="256" y="196" class="d-s d-green d-ct" text-anchor="start" >11 random attesters</text>
<rect x="20" y="218" width="360" height="40" rx="8" class="d-box"/>
<text x="32" y="242" class="d-s" text-anchor="start" >Collateral</text>
<text x="112" y="242" class="d-s d-rose d-ct" text-anchor="start" >USDC, zero yield</text>
<text x="256" y="242" class="d-s d-green d-ct" text-anchor="start" >TYD, earns yield</text>
</svg>
