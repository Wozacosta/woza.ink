<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" role="img" aria-labelledby="t-pm-uma"><title id="t-pm-uma">UMA's optimistic oracle. Someone proposes an answer and posts a bond. If nobody challenges within a window the answer stands. If someone does, the dispute goes to a vote of UMA token holders, weighted by tokens held</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-pm-uma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<g data-node="proposal">
<rect x="20" y="16" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="34" r="4" class="d-violet d-fill"/>
<text x="46" y="38" class="d-t" text-anchor="start" >Proposal</text>
<text x="46" y="54" class="d-s" text-anchor="start" >someone proposes an answer and posts a bond</text>
</g>
<path d="M200,70 L200,98" class="d-line" data-edge="proposal-window" marker-end="url(#ah-pm-uma)"/>
<g data-node="window">
<rect x="20" y="100" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="118" r="4" class="d-amber d-fill"/>
<text x="46" y="122" class="d-t" text-anchor="start" >Challenge window</text>
<text x="46" y="138" class="d-s" text-anchor="start" >anyone can dispute it</text>
</g>
<path d="M104,154 L104,198" class="d-line" data-edge="window-stands" marker-end="url(#ah-pm-uma)"/>
<text x="112" y="180" class="d-s" text-anchor="start" data-edge="window-stands">no challenge</text>
<path d="M296,154 L296,198" class="d-line" data-edge="window-vote" marker-end="url(#ah-pm-uma)"/>
<text x="304" y="180" class="d-s" text-anchor="start" data-edge="window-vote">challenged</text>
<g data-node="stands">
<rect x="20" y="200" width="172" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="218" r="4" class="d-green d-fill"/>
<text x="46" y="222" class="d-t" text-anchor="start" >Answer stands</text>
<text x="46" y="238" class="d-s" text-anchor="start" >fast and cheap</text>
</g>
<g data-node="vote">
<rect x="208" y="200" width="172" height="54" rx="8" class="d-box"/>
<circle cx="222" cy="218" r="4" class="d-rose d-fill"/>
<text x="234" y="222" class="d-t" text-anchor="start" >UMA token vote</text>
<text x="234" y="238" class="d-s" text-anchor="start" >weighted by tokens held</text>
</g>
</svg>
