<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-pomo-data"><title id="t-pomo-data">Vercel serves the app's files to the browser. After that the timer and the count stay in the browser's Local Storage, music opens in a new tab, and there's no backend to send anything to</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-pomo-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Your data stays in the browser</text>
<text x="20" y="38" class="d-s" text-anchor="start" >The dashed box is the part that doesn't exist</text>
<g data-node="vercel">
<rect x="20" y="56" width="150" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="74" r="4" class="d-blue d-fill"/>
<text x="46" y="78" class="d-t" text-anchor="start" >Vercel</text>
<text x="46" y="94" class="d-s" text-anchor="start" >Serves the files</text>
</g>
<g data-node="backend">
<rect x="200" y="56" width="180" height="52" rx="8" class="d-ext"/>
<text x="214" y="78" class="d-t" text-anchor="start" >Backend</text>
<text x="214" y="94" class="d-s" text-anchor="start" >There isn't one</text>
</g>
<g data-node="browser">
<rect x="20" y="156" width="230" height="130" rx="8" class="d-box"/>
<circle cx="34" cy="174" r="4" class="d-green d-fill"/>
<text x="46" y="178" class="d-t" text-anchor="start" >Your browser</text>
</g>
<g data-node="app">
<rect x="36" y="192" width="198" height="38" rx="8" class="d-box"/>
<text x="50" y="215.5" class="d-t" text-anchor="start" >React app</text>
</g>
<g data-node="storage">
<rect x="36" y="238" width="198" height="38" rx="8" class="d-box"/>
<text x="50" y="261.5" class="d-t" text-anchor="start" >Local Storage</text>
</g>
<g data-node="music">
<rect x="290" y="185" width="90" height="52" rx="8" class="d-box"/>
<circle cx="304" cy="203" r="4" class="d-amber d-fill"/>
<text x="316" y="207" class="d-t" text-anchor="start" >New tab</text>
<text x="316" y="223" class="d-s" text-anchor="start" >Music</text>
</g>
<path d="M95,108 L95,154" class="d-line" data-edge="vercel-browser" marker-end="url(#ah-pomo-data)"/>
<text x="103" y="136" class="d-s" text-anchor="start" data-edge="vercel-browser">HTML and JS</text>
<path d="M234,211 L288,211" class="d-line" data-edge="app-music" marker-end="url(#ah-pomo-data)"/>
<path d="M135,230 V238" class="d-line" data-edge="app-storage"/>
<path d="M226,156 V108 M221,127 l10,10 M231,127 l-10,10" class="d-line d-rose d-stroke" data-edge="app-backend"/>
<text x="238" y="136" class="d-s d-rose d-ct" text-anchor="start" >No requests</text>
</svg>
