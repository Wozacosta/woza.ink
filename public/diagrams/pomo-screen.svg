<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" role="img" aria-labelledby="t-pomo-screen"><title id="t-pomo-screen">A wireframe of Pomo. The big countdown, here at 18:12, inside a thin progress ring takes the middle, with start, stop and skip under it, a short list of music links to the side, and today's count in small type</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-pomo-screen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Almost all of the screen is the clock</text>
<text x="20" y="38" class="d-s" text-anchor="start" >A sketch of what's described above</text>
<rect x="20" y="52" width="360" height="256" rx="8" class="d-line d-faint"/>
<g data-node="timer">
<rect x="36" y="64" width="212" height="174" rx="8" class="d-ext"/>
<circle cx="142" cy="150" r="72" class="d-line d-faint" stroke-width="5"/>
<circle cx="142" cy="150" r="72" class="d-line d-rose d-stroke" stroke-width="5" stroke-dasharray="330 452" transform="rotate(-90 142 150)" stroke-linecap="round"/>
<text x="142" y="161" class="d-t" text-anchor="middle" style="font-size:32px">18:12</text>
</g>
<g data-node="controls">
<rect x="36" y="246" width="212" height="48" rx="8" class="d-ext"/>
<rect x="46" y="256" width="60" height="28" rx="6" class="d-box"/>
<text x="76" y="274" class="d-s" text-anchor="middle" >Start</text>
<rect x="112" y="256" width="60" height="28" rx="6" class="d-box"/>
<text x="142" y="274" class="d-s" text-anchor="middle" >Stop</text>
<rect x="178" y="256" width="60" height="28" rx="6" class="d-box"/>
<text x="208" y="274" class="d-s" text-anchor="middle" >Skip</text>
</g>
<g data-node="music">
<rect x="260" y="64" width="108" height="130" rx="8" class="d-box"/>
<text x="272" y="86" class="d-t" text-anchor="start" >Music</text>
<text x="272" y="110" class="d-s" text-anchor="start" >Playlist ↗</text>
<text x="272" y="134" class="d-s" text-anchor="start" >Playlist ↗</text>
<text x="272" y="158" class="d-s" text-anchor="start" >Playlist ↗</text>
</g>
<g data-node="count">
<rect x="260" y="246" width="108" height="48" rx="8" class="d-ext"/>
<text x="272" y="266" class="d-s" text-anchor="start" >Today</text>
<circle cx="277" cy="279" r="4" class="d-rose d-fill"/><circle cx="291" cy="279" r="4" class="d-rose d-fill"/><circle cx="305" cy="279" r="4" class="d-rose d-fill"/>
</g>
</svg>
