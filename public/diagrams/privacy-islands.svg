<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 226" role="img" aria-labelledby="t-privacy-islands"><title id="t-privacy-islands">Monero and Zcash are separate chains with no route into DeFi. Lending, trading, yield, NFTs and DAOs live on Ethereum and EVM chains, where everything is public</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-privacy-islands" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Privacy here, DeFi over there</text>
<rect x="20" y="44" width="126" height="60" rx="8" class="d-box"/>
<circle cx="34" cy="62" r="4" class="d-green d-fill"/>
<text x="46" y="66" class="d-t" text-anchor="start" >Monero</text>
<text x="46" y="82" class="d-s" text-anchor="start" >own chain</text>
<rect x="20" y="120" width="126" height="60" rx="8" class="d-box"/>
<circle cx="34" cy="138" r="4" class="d-green d-fill"/>
<text x="46" y="142" class="d-t" text-anchor="start" >Zcash</text>
<text x="46" y="158" class="d-s" text-anchor="start" >own chain</text>
<rect x="190" y="44" width="190" height="136" rx="8" class="d-ext"/>
<text x="204" y="66" class="d-t" text-anchor="start" >Ethereum and EVM chains</text>
<text x="204" y="82" class="d-s d-rose d-ct" text-anchor="start" >everything public</text>
<text x="204" y="106" class="d-s" text-anchor="start" >Lending</text>
<text x="288" y="106" class="d-s" text-anchor="start" >Trading</text>
<text x="204" y="132" class="d-s" text-anchor="start" >Yield</text>
<text x="288" y="132" class="d-s" text-anchor="start" >NFTs</text>
<text x="204" y="158" class="d-s" text-anchor="start" >DAOs</text>
<line x1="168" y1="52" x2="168" y2="172" class="d-line d-rose d-stroke" stroke-dasharray="4 3"/>
<text x="168" y="204" class="d-s d-rose d-ct" text-anchor="middle" >no route across</text>
</svg>
