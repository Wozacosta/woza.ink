<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" role="img" aria-labelledby="t-privacy-localmonero"><title id="t-privacy-localmonero">To scale. LocalMonero launched in 2017 and shut down in May 2024, giving users six months to withdraw. Haveno reached mainnet readiness in late 2024</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-privacy-localmonero" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Seven years of the easy route</text>
<rect x="20.0" y="44" width="330.7" height="24" rx="3" class="d-rose d-fill" opacity="0.8"/>
<rect x="352.7" y="44" width="20.5" height="24" rx="3" class="d-amber d-fill" opacity="0.8"/>
<text x="30" y="61" class="d-t" text-anchor="start" style="fill:var(--background,#faf8f5)">LocalMonero</text>
<line x1="373.2" y1="68" x2="373.2" y2="96" class="d-line d-green d-stroke"/>
<text x="380" y="108" class="d-s d-green d-ct" text-anchor="end" >Haveno, late 2024</text>
<line x1="350.7" y1="68" x2="350.7" y2="84" class="d-line d-amber d-stroke"/>
<text x="346.7499999999959" y="86" class="d-s d-amber d-ct" text-anchor="end" >Shut down May 2024, six months to withdraw</text>
<text x="20.0" y="136" class="d-s" text-anchor="start" >2017</text>
<text x="110.0" y="136" class="d-s" text-anchor="middle" >2019</text>
<text x="200.0" y="136" class="d-s" text-anchor="middle" >2021</text>
<text x="290.0" y="136" class="d-s" text-anchor="middle" >2023</text>
<text x="380.0" y="136" class="d-s" text-anchor="end" >2025</text>
<line x1="20" y1="122" x2="380" y2="122" class="d-line d-faint"/>
</svg>
