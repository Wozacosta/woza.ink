<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" role="img" aria-labelledby="t-privacy-p2p"><title id="t-privacy-p2p">The peer-to-peer options after LocalMonero closed in May 2024. Haveno trades Monero with Monero multisig escrow. Bisq trades Bitcoin with Bitcoin multisig escrow. xmr-btc-swap swaps Bitcoin for Monero with no exchange at all. RoboSats trades Bitcoin over Lightning with HODL invoices</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-privacy-p2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Buying without an account</text>
<g data-node="localmonero">
<rect x="20" y="36" width="360" height="54" rx="8" class="d-ext"/>
<circle cx="34" cy="54" r="4" class="d-rose d-fill"/>
<text x="46" y="58" class="d-t" text-anchor="start" >LocalMonero</text>
<text x="46" y="74" class="d-s" text-anchor="start" >hosted, shut down in May 2024</text>
</g>
<g data-node="haveno">
<rect x="20" y="118" width="176" height="58" rx="8" class="d-box"/>
<circle cx="34" cy="136" r="4" class="d-green d-fill"/>
<text x="46" y="140" class="d-t" text-anchor="start" >Haveno</text>
<text x="46" y="156" class="d-s" text-anchor="start" >XMR, multisig escrow</text>
</g>
<g data-node="bisq">
<rect x="204" y="118" width="176" height="58" rx="8" class="d-box"/>
<circle cx="218" cy="136" r="4" class="d-blue d-fill"/>
<text x="230" y="140" class="d-t" text-anchor="start" >Bisq</text>
<text x="230" y="156" class="d-s" text-anchor="start" >BTC base, multisig escrow</text>
</g>
<g data-node="swap">
<rect x="20" y="188" width="176" height="58" rx="8" class="d-box"/>
<circle cx="34" cy="206" r="4" class="d-amber d-fill"/>
<text x="46" y="210" class="d-t" text-anchor="start" >xmr-btc-swap</text>
<text x="46" y="226" class="d-s" text-anchor="start" >BTC to XMR, two wallets</text>
</g>
<g data-node="robosats">
<rect x="204" y="188" width="176" height="58" rx="8" class="d-box"/>
<circle cx="218" cy="206" r="4" class="d-violet d-fill"/>
<text x="230" y="210" class="d-t" text-anchor="start" >RoboSats</text>
<text x="230" y="226" class="d-s" text-anchor="start" >BTC over Lightning</text>
</g>
<text x="20" y="110" class="d-s" text-anchor="start" >What's left</text>
<text x="20" y="274" class="d-s" text-anchor="start" >Haveno and Bisq run on Tor with a desktop client. Liquidity is thin.</text>
</svg>
