<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-labelledby="t-publishing-gateways"><title id="t-publishing-gateways">The ENS gateways today. eth.limo is run by a small team and also powers eth.link, which Cloudflare used to run. eth.domains no longer resolves</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-publishing-gateways" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >One gateway, two names</text>
<rect x="20" y="40" width="170" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="58" r="4" class="d-green d-fill"/>
<text x="46" y="62" class="d-t" text-anchor="start" >eth.limo</text>
<text x="46" y="78" class="d-s" text-anchor="start" >A small team, on grants</text>
<rect x="210" y="40" width="170" height="54" rx="8" class="d-box"/>
<circle cx="224" cy="58" r="4" class="d-green d-fill"/>
<text x="236" y="62" class="d-t" text-anchor="start" >eth.link</text>
<text x="236" y="78" class="d-s" text-anchor="start" >Run with Cloudflare once</text>
<path d="M210,67 L192,67" class="d-line" marker-end="url(#ah-publishing-gateways)"/>
<text x="295" y="112" class="d-s" text-anchor="middle" >now powered by eth.limo</text>
<line x1="20" y1="128" x2="380" y2="128" class="d-line d-faint"/>
<rect x="20" y="144" width="360" height="54" rx="8" class="d-ext"/>
<circle cx="34" cy="162" r="4" class="d-rose d-fill"/>
<text x="46" y="166" class="d-t" text-anchor="start" >eth.domains</text>
<text x="46" y="182" class="d-s" text-anchor="start" >The name no longer resolves</text>
</svg>
