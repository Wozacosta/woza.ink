<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" role="img" aria-labelledby="t-publishing-landscape"><title id="t-publishing-landscape">The platforms grouped by where the writing is stored. Company servers: Medium, Substack, Paragraph and Minds. Arweave: Paragraph if you opt in, and Mirror, now dead. IPFS and storage built on it: Lens, t2.world, stalled, and Subsocial. Their own chain or consensus layer: Hive, Steemit, taken over, DeSo and Farcaster. Bitcoin: Sigle. AT Protocol, which isn't onchain: Leaflet and pckt.blog</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-publishing-landscape" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Where the writing actually lives</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Grouped by storage. The dot shows how each one is doing.</text>
<text x="20" y="64" class="d-s" text-anchor="start" >Company servers</text>
<rect x="20" y="72" width="83" height="32" rx="8" class="d-box"/>
<circle cx="34" cy="88.0" r="4" class="d-green d-fill"/>
<text x="46" y="92.5" class="d-t" text-anchor="start" >Medium</text>
<rect x="108" y="72" width="92" height="32" rx="8" class="d-box"/>
<circle cx="122" cy="88.0" r="4" class="d-green d-fill"/>
<text x="134" y="92.5" class="d-t" text-anchor="start" >Substack</text>
<rect x="205" y="72" width="99" height="32" rx="8" class="d-box"/>
<circle cx="219" cy="88.0" r="4" class="d-green d-fill"/>
<text x="231" y="92.5" class="d-t" text-anchor="start" >Paragraph</text>
<rect x="309" y="72" width="73" height="32" rx="8" class="d-box"/>
<circle cx="323" cy="88.0" r="4" class="d-green d-fill"/>
<text x="335" y="92.5" class="d-t" text-anchor="start" >Minds</text>
<text x="20" y="120" class="d-s" text-anchor="start" >Arweave</text>
<rect x="20" y="128" width="156" height="32" rx="8" class="d-box"/>
<circle cx="34" cy="144.0" r="4" class="d-green d-fill"/>
<text x="46" y="148.5" class="d-t" text-anchor="start" >Paragraph, opt-in</text>
<rect x="181" y="128" width="80" height="32" rx="8" class="d-box"/>
<circle cx="195" cy="144.0" r="4" class="d-rose d-fill"/>
<text x="207" y="148.5" class="d-t" text-anchor="start" >Mirror</text>
<text x="20" y="176" class="d-s" text-anchor="start" >IPFS and storage built on it</text>
<rect x="20" y="184" width="63" height="32" rx="8" class="d-box"/>
<circle cx="34" cy="200.0" r="4" class="d-green d-fill"/>
<text x="46" y="204.5" class="d-t" text-anchor="start" >Lens</text>
<rect x="88" y="184" width="95" height="32" rx="8" class="d-box"/>
<circle cx="102" cy="200.0" r="4" class="d-amber d-fill"/>
<text x="114" y="204.5" class="d-t" text-anchor="start" >t2.world</text>
<rect x="188" y="184" width="99" height="32" rx="8" class="d-box"/>
<circle cx="202" cy="200.0" r="4" class="d-green d-fill"/>
<text x="214" y="204.5" class="d-t" text-anchor="start" >Subsocial</text>
<text x="20" y="232" class="d-s" text-anchor="start" >Its own chain or consensus layer</text>
<rect x="20" y="240" width="63" height="32" rx="8" class="d-box"/>
<circle cx="34" cy="256.0" r="4" class="d-green d-fill"/>
<text x="46" y="260.5" class="d-t" text-anchor="start" >Hive</text>
<rect x="88" y="240" width="87" height="32" rx="8" class="d-box"/>
<circle cx="102" cy="256.0" r="4" class="d-amber d-fill"/>
<text x="114" y="260.5" class="d-t" text-anchor="start" >Steemit</text>
<rect x="180" y="240" width="63" height="32" rx="8" class="d-box"/>
<circle cx="194" cy="256.0" r="4" class="d-green d-fill"/>
<text x="206" y="260.5" class="d-t" text-anchor="start" >DeSo</text>
<rect x="248" y="240" width="99" height="32" rx="8" class="d-box"/>
<circle cx="262" cy="256.0" r="4" class="d-green d-fill"/>
<text x="274" y="260.5" class="d-t" text-anchor="start" >Farcaster</text>
<text x="20" y="288" class="d-s" text-anchor="start" >Bitcoin</text>
<rect x="20" y="296" width="70" height="32" rx="8" class="d-box"/>
<circle cx="34" cy="312.0" r="4" class="d-green d-fill"/>
<text x="46" y="316.5" class="d-t" text-anchor="start" >Sigle</text>
<text x="20" y="344" class="d-s" text-anchor="start" >AT Protocol, not onchain</text>
<rect x="20" y="352" width="84" height="32" rx="8" class="d-box"/>
<circle cx="34" cy="368.0" r="4" class="d-green d-fill"/>
<text x="46" y="372.5" class="d-t" text-anchor="start" >Leaflet</text>
<rect x="109" y="352" width="99" height="32" rx="8" class="d-box"/>
<circle cx="123" cy="368.0" r="4" class="d-green d-fill"/>
<text x="135" y="372.5" class="d-t" text-anchor="start" >pckt.blog</text>
<circle cx="26" cy="398" r="4" class="d-green d-fill"/>
<text x="36" y="402" class="d-s" text-anchor="start" >Live</text>
<circle cx="84" cy="398" r="4" class="d-amber d-fill"/>
<text x="94" y="402" class="d-s" text-anchor="start" >Stalled or taken over</text>
<circle cx="232" cy="398" r="4" class="d-rose d-fill"/>
<text x="242" y="402" class="d-s" text-anchor="start" >Dead</text>
</svg>
