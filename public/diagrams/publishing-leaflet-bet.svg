<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-publishing-leaflet-bet"><title id="t-publishing-leaflet-bet">Two bets compared. Crypto-native platforms decentralize storage with Arweave or IPFS, use a wallet, and keep the words if the app dies. Leaflet on AT Protocol has no IPFS or Arweave, uses an AT handle, and keeps identity and followers if the app dies</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-publishing-leaflet-bet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >The same problem, two bets</text>
<text x="20" y="38" class="d-s" text-anchor="start" >What each one actually takes off the platform</text>
<text x="20" y="62" class="d-t" text-anchor="start" >Crypto-native</text>
<text x="205" y="62" class="d-t" text-anchor="start" >Leaflet, on AT Protocol</text>
<text x="20" y="82" class="d-s" text-anchor="start" >Storage</text>
<rect x="20" y="90" width="175" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="108" r="4" class="d-green d-fill"/>
<text x="46" y="112" class="d-t" text-anchor="start" >Arweave or IPFS</text>
<text x="46" y="128" class="d-s" text-anchor="start" >Decentralized storage</text>
<rect x="205" y="90" width="175" height="52" rx="8" class="d-box"/>
<circle cx="219" cy="108" r="4" class="d-rose d-fill"/>
<text x="231" y="112" class="d-t" text-anchor="start" >No IPFS or Arweave</text>
<text x="231" y="128" class="d-s" text-anchor="start" >Not the bet here</text>
<text x="20" y="154" class="d-s" text-anchor="start" >Identity</text>
<rect x="20" y="162" width="175" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="180" r="4" class="d-green d-fill"/>
<text x="46" y="184" class="d-t" text-anchor="start" >A wallet</text>
<text x="46" y="200" class="d-s" text-anchor="start" >A key you hold</text>
<rect x="205" y="162" width="175" height="52" rx="8" class="d-box"/>
<circle cx="219" cy="180" r="4" class="d-green d-fill"/>
<text x="231" y="184" class="d-t" text-anchor="start" >Your AT handle</text>
<text x="231" y="200" class="d-s" text-anchor="start" >Not a platform account</text>
<text x="20" y="226" class="d-s" text-anchor="start" >If the app dies</text>
<rect x="20" y="234" width="175" height="52" rx="8" class="d-box"/>
<circle cx="34" cy="252" r="4" class="d-green d-fill"/>
<text x="46" y="256" class="d-t" text-anchor="start" >The words stay</text>
<text x="46" y="272" class="d-s" text-anchor="start" >On permanent storage</text>
<rect x="205" y="234" width="175" height="52" rx="8" class="d-box"/>
<circle cx="219" cy="252" r="4" class="d-green d-fill"/>
<text x="231" y="256" class="d-t" text-anchor="start" >The audience stays</text>
<text x="231" y="272" class="d-s" text-anchor="start" >Identity and followers</text>
</svg>
