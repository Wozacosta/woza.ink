<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 212" role="img" aria-labelledby="t-publishing-mirror-fate"><title id="t-publishing-mirror-fate">Before and after. On Mirror a post had a page on mirror.xyz and a permanent copy on Arweave. By November 2025 the posts and subscribers had migrated to Paragraph, and the Arweave copy was unchanged</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-publishing-mirror-fate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >One post, before and after</text>
<text x="20" y="56" class="d-s" text-anchor="start" >On Mirror</text>
<text x="230" y="56" class="d-s" text-anchor="start" >By November 2025</text>
<rect x="20" y="66" width="150" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="84" r="4" class="d-rose d-fill"/>
<text x="46" y="88" class="d-t" text-anchor="start" >mirror.xyz</text>
<text x="46" y="104" class="d-s" text-anchor="start" >Page and subscribers</text>
<rect x="230" y="66" width="150" height="54" rx="8" class="d-box"/>
<circle cx="244" cy="84" r="4" class="d-green d-fill"/>
<text x="256" y="88" class="d-t" text-anchor="start" >Paragraph</text>
<text x="256" y="104" class="d-s" text-anchor="start" >Post and subscribers</text>
<path d="M170,93 L228,93" class="d-line" marker-end="url(#ah-publishing-mirror-fate)"/>
<text x="199" y="86" class="d-s" text-anchor="middle" >migrated</text>
<rect x="20" y="136" width="150" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="154" r="4" class="d-green d-fill"/>
<text x="46" y="158" class="d-t" text-anchor="start" >Arweave</text>
<text x="46" y="174" class="d-s" text-anchor="start" >Permanent copy</text>
<rect x="230" y="136" width="150" height="54" rx="8" class="d-box"/>
<circle cx="244" cy="154" r="4" class="d-green d-fill"/>
<text x="256" y="158" class="d-t" text-anchor="start" >Arweave</text>
<text x="256" y="174" class="d-s" text-anchor="start" >The same copy</text>
<path d="M170,163 L228,163" class="d-line" marker-end="url(#ah-publishing-mirror-fate)"/>
<text x="199" y="156" class="d-s" text-anchor="middle" >untouched</text>
</svg>
