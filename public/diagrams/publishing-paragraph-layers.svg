<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-publishing-paragraph-layers"><title id="t-publishing-paragraph-layers">Paragraph has two layers. The web2 layer is always on: email delivery, SEO and analytics. The web3 layer is opt-in: an Arweave copy, NFT collects, NFT memberships and token-gated posts. Without Arweave, a post lives on Paragraph's servers</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-publishing-paragraph-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Two layers, and only one is opt-in</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Reading needs no wallet, because the top layer does the work</text>
<text x="20" y="60" class="d-s d-green d-ct" text-anchor="start" >Web2 layer: always on</text>
<g data-node="email">
<rect x="20" y="68" width="112" height="44" rx="8" class="d-box"/>
<circle cx="34" cy="90.0" r="4" class="d-green d-fill"/>
<text x="46" y="94.5" class="d-t" text-anchor="start" >Email</text>
</g>
<g data-node="seo">
<rect x="144" y="68" width="112" height="44" rx="8" class="d-box"/>
<circle cx="158" cy="90.0" r="4" class="d-green d-fill"/>
<text x="170" y="94.5" class="d-t" text-anchor="start" >SEO</text>
</g>
<g data-node="analytics">
<rect x="268" y="68" width="112" height="44" rx="8" class="d-box"/>
<circle cx="282" cy="90.0" r="4" class="d-green d-fill"/>
<text x="294" y="94.5" class="d-t" text-anchor="start" >Analytics</text>
</g>
<text x="20" y="136" class="d-s d-violet d-ct" text-anchor="start" >Web3 layer: opt-in</text>
<g data-node="arweave">
<rect x="20" y="144" width="174" height="44" rx="8" class="d-box"/>
<circle cx="34" cy="166.0" r="4" class="d-violet d-fill"/>
<text x="46" y="170.5" class="d-t" text-anchor="start" >Arweave copy</text>
</g>
<g data-node="collects">
<rect x="206" y="144" width="174" height="44" rx="8" class="d-box"/>
<circle cx="220" cy="166.0" r="4" class="d-violet d-fill"/>
<text x="232" y="170.5" class="d-t" text-anchor="start" >NFT collects</text>
</g>
<g data-node="memberships">
<rect x="20" y="196" width="174" height="44" rx="8" class="d-box"/>
<circle cx="34" cy="218.0" r="4" class="d-violet d-fill"/>
<text x="46" y="222.5" class="d-t" text-anchor="start" >NFT memberships</text>
</g>
<g data-node="gating">
<rect x="206" y="196" width="174" height="44" rx="8" class="d-box"/>
<circle cx="220" cy="218.0" r="4" class="d-violet d-fill"/>
<text x="232" y="222.5" class="d-t" text-anchor="start" >Token-gated posts</text>
</g>
<line x1="20" y1="256" x2="380" y2="256" class="d-line d-faint"/>
<text x="20" y="280" class="d-s" text-anchor="start" >Skip Arweave and the post lives on Paragraph's servers.</text>
</svg>
