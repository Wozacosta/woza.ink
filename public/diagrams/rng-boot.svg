<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 232" role="img" aria-labelledby="t-rng-boot"><title id="t-rng-boot">What each interface does around boot on Linux 5.6 and later. Before the pool is initialized, dev random and getrandom block, while dev urandom keeps answering with weak output. After initialization all three give the same CSPRNG output and never block again</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-rng-boot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Before and after the pool is ready</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Linux 5.6 and later. Not to scale.</text>
<text x="20" y="79" class="d-t d-m" text-anchor="start" >getrandom()</text>
<rect x="122" y="58" width="108" height="32" rx="3" class="d-green d-fill" opacity="0.18"/>
<text x="176" y="78" class="d-s" text-anchor="middle" >blocks</text>
<rect x="234" y="58" width="146" height="32" rx="3" class="d-green d-fill" opacity="0.8"/>
<text x="306" y="78" class="d-s" text-anchor="middle" style="fill:var(--background,#faf8f5)">same CSPRNG</text>
<text x="20" y="121" class="d-t d-m" text-anchor="start" >/dev/random</text>
<rect x="122" y="100" width="108" height="32" rx="3" class="d-green d-fill" opacity="0.18"/>
<text x="176" y="120" class="d-s" text-anchor="middle" >blocks</text>
<rect x="234" y="100" width="146" height="32" rx="3" class="d-green d-fill" opacity="0.8"/>
<text x="306" y="120" class="d-s" text-anchor="middle" style="fill:var(--background,#faf8f5)">same CSPRNG</text>
<text x="20" y="163" class="d-t d-m" text-anchor="start" >/dev/urandom</text>
<rect x="122" y="142" width="108" height="32" rx="3" class="d-rose d-fill" opacity="0.8"/>
<text x="176" y="162" class="d-s" text-anchor="middle" style="fill:var(--background,#faf8f5)">answers anyway</text>
<rect x="234" y="142" width="146" height="32" rx="3" class="d-green d-fill" opacity="0.8"/>
<text x="306" y="162" class="d-s" text-anchor="middle" style="fill:var(--background,#faf8f5)">same CSPRNG</text>
<line x1="232" y1="50" x2="232" y2="190" class="d-line" stroke-dasharray="4 3"/>
<text x="232" y="206" class="d-s" text-anchor="middle" >pool initialized</text>
<text x="122" y="206" class="d-s" text-anchor="start" >boot</text>
<text x="380" y="206" class="d-s" text-anchor="end" >forever after</text>
<text x="122" y="222" class="d-s d-rose d-ct" text-anchor="start" >the dangerous window</text>
</svg>
