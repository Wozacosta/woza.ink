<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 248" role="img" aria-labelledby="t-rng-families"><title id="t-rng-families">Three kinds of generator. A TRNG harvests physical noise and is non-deterministic but slow. A PRNG is an algorithm: the same seed always gives the same stream, which suits simulations. A CSPRNG is a PRNG with an extra guarantee: output doesn't reveal the next value or the seed</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-rng-families" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<rect x="20" y="16" width="360" height="66" rx="8" class="d-box"/>
<circle cx="34" cy="35" r="4" class="d-amber d-fill"/>
<text x="46" y="40" class="d-t" text-anchor="start" >TRNG</text>
<text x="46" y="60" class="d-s" text-anchor="start" >physical noise</text>
<text x="368" y="40" class="d-s" text-anchor="end" >Non-deterministic</text>
<text x="368" y="60" class="d-s" text-anchor="end" >Slow, hard to verify</text>
<rect x="20" y="92" width="360" height="66" rx="8" class="d-box"/>
<circle cx="34" cy="111" r="4" class="d-blue d-fill"/>
<text x="46" y="116" class="d-t" text-anchor="start" >PRNG</text>
<text x="46" y="136" class="d-s" text-anchor="start" >seed plus algorithm</text>
<text x="368" y="116" class="d-s" text-anchor="end" >Same seed, same stream</text>
<text x="368" y="136" class="d-s" text-anchor="end" >Fast: simulations, games</text>
<rect x="20" y="168" width="360" height="66" rx="8" class="d-box"/>
<circle cx="34" cy="187" r="4" class="d-green d-fill"/>
<text x="46" y="192" class="d-t" text-anchor="start" >CSPRNG</text>
<text x="46" y="212" class="d-s" text-anchor="start" >a PRNG with a guarantee</text>
<text x="368" y="192" class="d-s" text-anchor="end" >Output won't reveal the seed</text>
<text x="368" y="212" class="d-s" text-anchor="end" >Fast: keys, nonces</text>
</svg>
