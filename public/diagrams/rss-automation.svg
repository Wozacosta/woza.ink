<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 204" role="img" aria-labelledby="t-rss-automation"><title id="t-rss-automation">Two automations. A blog feed goes through a rule that matches the word tutorial and lands in Notion. A release feed goes through IFTTT or Make and lands in a Slack channel</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-rss-automation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >A feed is an input to anything</text>
<rect x="20" y="44" width="112" height="60" rx="8" class="d-box"/>
<text x="34" y="66" class="d-t" text-anchor="start" >Blog feed</text>
<text x="34" y="82" class="d-s" text-anchor="start" >New posts</text>
<rect x="144" y="44" width="112" height="60" rx="8" class="d-box"/>
<circle cx="158" cy="62" r="4" class="d-violet d-fill"/>
<text x="170" y="66" class="d-t" text-anchor="start" >Rule</text>
<text x="170" y="82" class="d-s" text-anchor="start" >Says "tutorial"</text>
<rect x="268" y="44" width="112" height="60" rx="8" class="d-box"/>
<circle cx="282" cy="62" r="4" class="d-green d-fill"/>
<text x="294" y="66" class="d-t" text-anchor="start" >Notion</text>
<text x="294" y="82" class="d-s" text-anchor="start" >Saved to read</text>
<path d="M132,74 L142,74" class="d-line" marker-end="url(#ah-rss-automation)"/>
<path d="M256,74 L266,74" class="d-line" marker-end="url(#ah-rss-automation)"/>
<rect x="20" y="120" width="112" height="60" rx="8" class="d-box"/>
<text x="34" y="142" class="d-t" text-anchor="start" >Release feed</text>
<text x="34" y="158" class="d-s" text-anchor="start" >Release notes</text>
<rect x="144" y="120" width="112" height="60" rx="8" class="d-box"/>
<circle cx="158" cy="138" r="4" class="d-violet d-fill"/>
<text x="170" y="142" class="d-t" text-anchor="start" >IFTTT, Make</text>
<text x="170" y="158" class="d-s" text-anchor="start" >On each item</text>
<rect x="268" y="120" width="112" height="60" rx="8" class="d-box"/>
<circle cx="282" cy="138" r="4" class="d-green d-fill"/>
<text x="294" y="142" class="d-t" text-anchor="start" >Slack</text>
<text x="294" y="158" class="d-s" text-anchor="start" >A team channel</text>
<path d="M132,150 L142,150" class="d-line" marker-end="url(#ah-rss-automation)"/>
<path d="M256,150 L266,150" class="d-line" marker-end="url(#ah-rss-automation)"/>
</svg>
