<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" role="img" aria-labelledby="t-rss-unread"><title id="t-rss-unread">A sketch of the unread count over days. It climbs toward 300, drops to zero when everything is marked read, and climbs again. A dashed line shows it rising without limit if it becomes a to-do list</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-rss-unread" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Unread is a tide, not a to-do list</text>
<text x="20" y="38" class="d-s" text-anchor="start" >A sketch of the count over a few weeks</text>
<line x1="40" y1="220" x2="380" y2="220" class="d-line d-faint"/>
<line x1="40" y1="88" x2="380" y2="88" class="d-line d-faint" stroke-dasharray="3 3"/>
<text x="36" y="92" class="d-s" text-anchor="end" >300</text>
<text x="36" y="224" class="d-s" text-anchor="end" >0</text>
<path d="M40,220 L120,88 L120,220 L200,88 L200,220 L280,88 L280,220 L330,137" class="d-line d-green d-stroke" style="stroke-width:2"/>
<path d="M280,88 L372,56" class="d-line d-rose d-stroke" stroke-dasharray="4 3"/>
<text x="292" y="70" class="d-s d-rose d-ct" text-anchor="end" >never marked read</text>
<text x="120" y="238" class="d-s" text-anchor="middle" >mark all read</text>
<text x="200" y="238" class="d-s" text-anchor="middle" >mark all read</text>
<text x="280" y="238" class="d-s" text-anchor="middle" >mark all read</text>
<text x="20" y="258" class="d-s" text-anchor="start" >Each drop costs nothing: the good ones come back another way.</text>
</svg>
