<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" role="img" aria-labelledby="t-searxng-agent-cost"><title id="t-searxng-agent-cost">Monthly cost at a made-up rate of 1,000 searches a day. Kagi's API at 12 dollars per 1,000 comes to 360 dollars a month, against 10 dollars for a person's unlimited plan and nothing per query for SearXNG, which pays with IP blocks instead</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-searxng-agent-cost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >An agent that searches 1,000 times a day</text>
<text x="20" y="38" class="d-s" text-anchor="start" >An example rate, over 30 days. Bars to scale.</text>
<text x="20" y="68" class="d-t" text-anchor="start" >Kagi API</text>
<text x="380" y="68" class="d-t d-violet d-ct" text-anchor="end" >$360</text>
<text x="20" y="84" class="d-s" text-anchor="start" >$12 per 1,000</text>
<rect x="20" y="90" width="360.0" height="14" rx="1" class="d-violet d-fill" opacity="0.85"/>
<text x="20" y="126" class="d-t" text-anchor="start" >Kagi plan, for a person</text>
<text x="380" y="126" class="d-t d-blue d-ct" text-anchor="end" >$10</text>
<text x="20" y="142" class="d-s" text-anchor="start" >Not for agents</text>
<rect x="20" y="148" width="10.0" height="14" rx="1" class="d-blue d-fill" opacity="0.85"/>
<text x="20" y="184" class="d-t" text-anchor="start" >SearXNG</text>
<text x="380" y="184" class="d-t d-green d-ct" text-anchor="end" >$0</text>
<text x="20" y="200" class="d-s" text-anchor="start" >Pays in blocked IPs</text>
<rect x="20" y="206" width="0.8" height="14" rx="1" class="d-green d-fill" opacity="0.85"/>
</svg>
