<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 276" role="img" aria-labelledby="t-searxng-doors"><title id="t-searxng-doors">Two ways into Google's results. If the remedies hold, a Qualified Competitor gets a front door through search syndication, which is where Kagi would need to qualify. Everyone else stays at the back door: third-party scrapers and SearXNG, while Google narrows it</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-searxng-doors" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<rect x="20" y="16" width="360" height="48" rx="8" class="d-box"/>
<circle cx="34" cy="40.0" r="4" class="d-blue d-fill"/>
<text x="46" y="44.5" class="d-t" text-anchor="start" >Google's results</text>
<path d="M105,112 L105,66" class="d-line" stroke-dasharray="4 3" marker-end="url(#ah-searxng-doors)"/>
<text x="113" y="92" class="d-s" text-anchor="start" >syndication</text>
<path d="M295,112 L295,66" class="d-line" marker-end="url(#ah-searxng-doors)"/>
<text x="303" y="92" class="d-s" text-anchor="start" >scraping</text>
<text x="105" y="128" class="d-s d-green d-ct" text-anchor="middle" >Front door, if it opens</text>
<text x="295" y="128" class="d-s d-rose d-ct" text-anchor="middle" >Back door, narrowing</text>
<rect x="20" y="140" width="170" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="158" r="4" class="d-green d-fill"/>
<text x="46" y="162" class="d-t" text-anchor="start" >Qualified Competitors</text>
<text x="46" y="178" class="d-s" text-anchor="start" >Kagi, if it qualifies</text>
<rect x="210" y="140" width="170" height="54" rx="8" class="d-box"/>
<circle cx="224" cy="158" r="4" class="d-amber d-fill"/>
<text x="236" y="162" class="d-t" text-anchor="start" >Third-party providers</text>
<text x="236" y="178" class="d-s" text-anchor="start" >Kagi, for now</text>
<rect x="210" y="206" width="170" height="54" rx="8" class="d-box"/>
<circle cx="224" cy="224" r="4" class="d-rose d-fill"/>
<text x="236" y="228" class="d-t" text-anchor="start" >Your container</text>
<text x="236" y="244" class="d-s" text-anchor="start" >SearXNG, always</text>
</svg>
