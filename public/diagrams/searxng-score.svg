<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 246" role="img" aria-labelledby="t-searxng-score"><title id="t-searxng-score">Three results drawn as bars to scale, with one segment per engine. First place on one engine scores 1. First place on two engines scores 2 divided by 1 twice, which is 4. Fifth place on three engines scores 3 divided by 5 three times, which is 1.8</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-searxng-score" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >How agreement adds up</text>
<text x="20" y="38" class="d-s" text-anchor="start" >To scale. Each engine adds: engines that found it / position</text>
<text x="20" y="68" class="d-t" text-anchor="start" >First on one engine</text>
<text x="380" y="68" class="d-s d-m" text-anchor="end" >1/1 = 1</text>
<rect x="20" y="76" width="88" height="24" rx="2" class="d-rose d-fill" opacity="0.8"/>
<text x="20" y="128" class="d-t" text-anchor="start" >First on two engines</text>
<text x="380" y="128" class="d-s d-m" text-anchor="end" >2/1 + 2/1 = 4</text>
<rect x="20" y="136" width="178" height="24" rx="2" class="d-green d-fill" opacity="0.8"/>
<rect x="200" y="136" width="178" height="24" rx="2" class="d-green d-fill" opacity="0.8"/>
<text x="20" y="188" class="d-t" text-anchor="start" >Fifth on three engines</text>
<text x="380" y="188" class="d-s d-m" text-anchor="end" >3/5 + 3/5 + 3/5 = 1.8</text>
<rect x="20" y="196" width="52" height="24" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="74" y="196" width="52" height="24" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="128" y="196" width="52" height="24" rx="2" class="d-amber d-fill" opacity="0.8"/>
</svg>
