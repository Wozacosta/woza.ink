<path d="M185.0,142 v6 H256.25 v-6" class="d-line d-faint"/>
<text x="220.625" y="170" class="d-t d-rose d-ct" text-anchor="middle" >Readable</text>
<text x="220.625" y="186" class="d-s" text-anchor="middle" >By the thief</text>
<path d="M267.5,142 v6 H380.0 v-6" class="d-line d-faint"/>
