<text x="200.0" y="62" class="d-s d-rose d-ct" text-anchor="middle" >key stolen</text>
<path d="M200.0,68 L200.0,96" class="d-line" marker-end="url(#ah-signal-ratchet)"/>
<text x="261.875" y="80" class="d-s d-violet d-ct" text-anchor="middle" >next ratchet step</text>
