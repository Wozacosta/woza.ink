<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 288" role="img" aria-labelledby="t-social-mastodon-timelines"><title id="t-social-mastodon-timelines">A sketch of two Mastodon timelines. The local timeline only has posts from your instance. The federated timeline mixes posts from any instance that your instance's users follow</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-social-mastodon-timelines" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Same app, two views of the network</text>
<text x="20" y="38" class="d-s" text-anchor="start" >A sketch. Each row is one post, each dot its home server.</text>
<rect x="20" y="50" width="170" height="172" rx="8" class="d-box"/>
<text x="34" y="72" class="d-t" text-anchor="start" >Local</text>
<circle cx="40" cy="95" r="5" class="d-blue d-fill"/>
<rect x="54" y="92" width="110" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<circle cx="40" cy="121" r="5" class="d-blue d-fill"/>
<rect x="54" y="118" width="86" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<circle cx="40" cy="147" r="5" class="d-blue d-fill"/>
<rect x="54" y="144" width="118" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<circle cx="40" cy="173" r="5" class="d-blue d-fill"/>
<rect x="54" y="170" width="74" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<circle cx="40" cy="199" r="5" class="d-blue d-fill"/>
<rect x="54" y="196" width="100" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<rect x="210" y="50" width="170" height="172" rx="8" class="d-box"/>
<text x="224" y="72" class="d-t" text-anchor="start" >Federated</text>
<circle cx="230" cy="95" r="5" class="d-green d-fill"/>
<rect x="244" y="92" width="104" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<circle cx="230" cy="121" r="5" class="d-blue d-fill"/>
<rect x="244" y="118" width="118" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<circle cx="230" cy="147" r="5" class="d-amber d-fill"/>
<rect x="244" y="144" width="80" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<circle cx="230" cy="173" r="5" class="d-violet d-fill"/>
<rect x="244" y="170" width="112" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<circle cx="230" cy="199" r="5" class="d-green d-fill"/>
<rect x="244" y="196" width="92" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<text x="20" y="242" class="d-s" text-anchor="start" >Just your instance</text>
<text x="210" y="242" class="d-s" text-anchor="start" >All your instance's users follow</text>
<circle cx="24" cy="268" r="4" class="d-blue d-fill"/>
<text x="34" y="272" class="d-s" text-anchor="start" >Your instance</text>
<circle cx="130" cy="268" r="4" class="d-green d-fill"/>
<circle cx="142" cy="268" r="4" class="d-amber d-fill"/>
<circle cx="154" cy="268" r="4" class="d-violet d-fill"/>
<text x="164" y="272" class="d-s" text-anchor="start" >Other instances</text>
</svg>
