<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" role="img" aria-labelledby="t-social-miniapp"><title id="t-social-miniapp">A sketch of a Farcaster feed. Between ordinary posts sit a poll you can answer and a mint button you can press, without leaving the feed</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-social-miniapp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >A feed you can press</text>
<text x="20" y="38" class="d-s" text-anchor="start" >A sketch. The cards run inside the feed.</text>
<rect x="20" y="52" width="210" height="256" rx="14" class="d-box"/>
<rect x="36" y="72" width="150" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<rect x="36" y="84" width="110" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<rect x="34" y="102" width="182" height="82" rx="8" class="d-ext"/>
<rect x="46" y="114" width="110" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<rect x="46" y="130" width="120" height="16" rx="3" class="d-violet d-fill" opacity="0.8"/>
<rect x="46" y="152" width="70" height="16" rx="3" class="d-violet d-fill" opacity="0.45"/>
<rect x="36" y="198" width="160" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<rect x="34" y="214" width="182" height="74" rx="8" class="d-ext"/>
<rect x="46" y="226" width="96" height="6" rx="3" style="fill:var(--line-strong,#cfc8bc)"/>
<rect x="46" y="244" width="158" height="30" rx="6" class="d-green d-fill" opacity="0.85"/>
<text x="125" y="263" class="d-s" text-anchor="middle" style="fill:var(--background,#faf8f5)">Mint</text>
<path d="M248,142 L220,142" class="d-line" marker-end="url(#ah-social-miniapp)"/>
<text x="254" y="138" class="d-s" text-anchor="start" >A poll, answered</text>
<text x="254" y="153" class="d-s" text-anchor="start" >where it sits</text>
<path d="M248,258 L210,258" class="d-line" marker-end="url(#ah-social-miniapp)"/>
<text x="254" y="254" class="d-s" text-anchor="start" >A mint or a payment,</text>
<text x="254" y="269" class="d-s" text-anchor="start" >no other app opens</text>
</svg>
