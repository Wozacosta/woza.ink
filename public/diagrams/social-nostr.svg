<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" role="img" aria-labelledby="t-social-nostr"><title id="t-social-nostr">A sketch with three relays. Your keypair signs an event and you publish it to relays you choose. Clients read from whichever relays they like. If one relay is blocked, the event still reaches clients through the others</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-social-nostr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<g data-node="key">
<rect x="20" y="16" width="360" height="54" rx="8" class="d-box"/>
<circle cx="34" cy="34" r="4" class="d-green d-fill"/>
<text x="46" y="38" class="d-t" text-anchor="start" >Your keypair</text>
<text x="46" y="54" class="d-s" text-anchor="start" >Your identity, portable to any client</text>
</g>
<path d="M75,70 L75,116" class="d-line" data-edge="key-relaya" marker-end="url(#ah-social-nostr)"/>
<text x="83" y="97" class="d-s" text-anchor="start" data-edge="key-relaya">signed</text>
<path d="M200,70 L200,116" class="d-line d-faint" stroke-dasharray="4 3" data-edge="key-relayb" marker-end="url(#ah-social-nostr)"/>
<path d="M325,70 L325,116" class="d-line" data-edge="key-relayc" marker-end="url(#ah-social-nostr)"/>
<text x="333" y="97" class="d-s" text-anchor="start" data-edge="key-relayc">signed</text>
<g data-node="relaya">
<rect x="20" y="118" width="110" height="44" rx="8" class="d-box"/>
<text x="75.0" y="144.5" class="d-t" text-anchor="middle" >Relay A</text>
</g>
<g data-node="relayb">
<rect x="145" y="118" width="110" height="44" rx="8" class="d-ext"/>
<text x="200.0" y="144.5" class="d-t" text-anchor="middle" >Relay B</text>
</g>
<g data-node="relayc">
<rect x="270" y="118" width="110" height="44" rx="8" class="d-box"/>
<text x="325.0" y="144.5" class="d-t" text-anchor="middle" >Relay C</text>
</g>
<text x="200" y="178" class="d-s d-rose d-ct" text-anchor="middle" >blocked</text>
<path d="M55,162 L55,212" class="d-line" data-edge="relaya-primal" marker-end="url(#ah-social-nostr)"/>
<path d="M112,162 L168,212" class="d-line" data-edge="relaya-snort" marker-end="url(#ah-social-nostr)"/>
<path d="M288,162 L232,212" class="d-line" data-edge="relayc-snort" marker-end="url(#ah-social-nostr)"/>
<path d="M345,162 L345,212" class="d-line" data-edge="relayc-damus" marker-end="url(#ah-social-nostr)"/>
<g data-node="primal">
<rect x="20" y="214" width="110" height="44" rx="8" class="d-box"/>
<text x="75.0" y="240.5" class="d-t" text-anchor="middle" >Primal</text>
</g>
<g data-node="snort">
<rect x="145" y="214" width="110" height="44" rx="8" class="d-box"/>
<text x="200.0" y="240.5" class="d-t" text-anchor="middle" >Snort</text>
</g>
<g data-node="damus">
<rect x="270" y="214" width="110" height="44" rx="8" class="d-box"/>
<text x="325.0" y="240.5" class="d-t" text-anchor="middle" >Damus</text>
</g>
<line x1="20" y1="274" x2="380" y2="274" class="d-line d-faint"/>
<text x="20" y="298" class="d-t" text-anchor="start" >Every client still got the event.</text>
</svg>
