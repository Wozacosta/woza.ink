<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" role="img" aria-labelledby="t-social-ownership"><title id="t-social-ownership">Where your account lives on each network. On the fediverse it is one instance, and on Bluesky one PDS. Farcaster splits identity on Optimism from posts on Snapchain. Lens keeps your account and followers on its own chain and posts on Grove. Nostr splits a key you hold from the relays you pick</title>
