<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 276" role="img" aria-labelledby="t-social-scale"><title id="t-social-scale">User counts from this post, to scale. Monthly: Threads at 350 million, with Mastodon at about 785,000 almost invisible beside it. Daily: Bluesky at about 3.5 million, with Lens at about 22,000 at its 2025 mainnet launch</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-social-scale" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >How big these networks are</text>
<text x="20" y="38" class="d-s" text-anchor="start" >To scale within each group. The two groups use different scales.</text>
<text x="20" y="64" class="d-s" text-anchor="start" >Monthly active users</text>
<text x="20" y="82" class="d-t" text-anchor="start" >Threads, on ActivityPub</text>
<text x="380" y="82" class="d-s d-m" text-anchor="end" >350M+</text>
<rect x="20" y="88" width="360.0" height="14" rx="1" class="d-violet d-fill" opacity="0.85"/>
<text x="20" y="124" class="d-t" text-anchor="start" >Mastodon</text>
<text x="380" y="124" class="d-s d-m" text-anchor="end" >~785K</text>
<rect x="20" y="130" width="0.8" height="14" rx="1" class="d-blue d-fill" opacity="0.85"/>
<text x="20" y="172" class="d-s" text-anchor="start" >Daily active users</text>
<text x="20" y="190" class="d-t" text-anchor="start" >Bluesky</text>
<text x="380" y="190" class="d-s d-m" text-anchor="end" >~3.5M</text>
<rect x="20" y="196" width="360.0" height="14" rx="1" class="d-blue d-fill" opacity="0.85"/>
<text x="20" y="232" class="d-t" text-anchor="start" >Lens, at its 2025 launch</text>
<text x="380" y="232" class="d-s d-m" text-anchor="end" >~22K</text>
<rect x="20" y="238" width="2.3" height="14" rx="1" class="d-amber d-fill" opacity="0.85"/>
</svg>
