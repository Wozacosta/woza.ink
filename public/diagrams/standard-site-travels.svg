<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 276" role="img" aria-labelledby="t-standard-site-travels"><title id="t-standard-site-travels">A sketch of one post in two places. On the blog it has a title, text, margin sidenotes and an interactive diagram. In another app, through the record, it has only the title and plain text</title>
<style>
