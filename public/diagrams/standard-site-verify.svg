<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 318" role="img" aria-labelledby="t-standard-site-verify"><title id="t-standard-site-verify">Your domain and your repo point at each other. The domain's well-known file and link tags name the AT-URI of each record. The records in your repo carry the site URL and path. A reader only trusts a record when both directions match</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-standard-site-verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<rect x="20" y="16" width="360" height="62" rx="8" class="d-box"/>
<circle cx="34" cy="34" r="4" class="d-blue d-fill"/>
<text x="46" y="38" class="d-t" text-anchor="start" >Your domain</text>
<text x="46" y="54" class="d-s" text-anchor="start" >.well-known file and a &lt;link&gt; tag on each post</text>
<rect x="20" y="196" width="360" height="62" rx="8" class="d-box"/>
<circle cx="34" cy="214" r="4" class="d-green d-fill"/>
<text x="46" y="218" class="d-t" text-anchor="start" >Your repo on a PDS</text>
<text x="46" y="234" class="d-s" text-anchor="start" >One publication record, one document per post</text>
<path d="M70,78 L70,194" class="d-line" marker-end="url(#ah-standard-site-verify)"/>
<text x="80" y="141" class="d-s" text-anchor="start" >names the record</text>
<path d="M330,196 L330,80" class="d-line" marker-end="url(#ah-standard-site-verify)"/>
<text x="320" y="141" class="d-s" text-anchor="end" >names the URL</text>
<line x1="20" y1="274" x2="380" y2="274" class="d-line d-faint"/>
<text x="20" y="298" class="d-t" text-anchor="start" >A record only counts when both directions match.</text>
</svg>
