<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 286" role="img" aria-labelledby="t-torrent-handshake"><title id="t-torrent-handshake">The 68-byte handshake drawn to scale: one length byte, 19 bytes of protocol name, 8 reserved bytes, the 20-byte infohash and the 20-byte peer ID</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-torrent-handshake" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >The handshake, byte by byte</text>
<text x="20" y="38" class="d-s" text-anchor="start" >68 bytes, drawn to scale</text>
<g data-node="len">
<rect x="20.0" y="54" width="3.8" height="36" rx="2" class="d-violet d-fill" opacity="0.85"/>
<rect x="20" y="98" width="360" height="28" rx="6" class="d-box"/>
<circle cx="34" cy="112" r="4" class="d-violet d-fill"/>
<text x="46" y="116" class="d-t" text-anchor="start" >Length</text>
<text x="176" y="116" class="d-s" text-anchor="start" >1 byte</text>
<text x="366" y="116" class="d-s" text-anchor="end" >The number 19</text>
</g>
<g data-node="name">
<rect x="25.3" y="54" width="99.1" height="36" rx="2" class="d-blue d-fill" opacity="0.85"/>
<rect x="20" y="132" width="360" height="28" rx="6" class="d-box"/>
<circle cx="34" cy="146" r="4" class="d-blue d-fill"/>
<text x="46" y="150" class="d-t" text-anchor="start" >Protocol name</text>
<text x="176" y="150" class="d-s" text-anchor="start" >19 bytes</text>
<text x="366" y="150" class="d-s" text-anchor="end" >BitTorrent protocol</text>
</g>
<g data-node="reserved">
<rect x="125.9" y="54" width="40.9" height="36" rx="2" class="d-amber d-fill" opacity="0.85"/>
<rect x="20" y="166" width="360" height="28" rx="6" class="d-box"/>
<circle cx="34" cy="180" r="4" class="d-amber d-fill"/>
<text x="46" y="184" class="d-t" text-anchor="start" >Reserved</text>
<text x="176" y="184" class="d-s" text-anchor="start" >8 bytes</text>
<text x="366" y="184" class="d-s" text-anchor="end" >Extension flags</text>
</g>
<g data-node="hash">
<rect x="168.2" y="54" width="104.4" height="36" rx="2" class="d-green d-fill" opacity="0.85"/>
<rect x="20" y="200" width="360" height="28" rx="6" class="d-box"/>
<circle cx="34" cy="214" r="4" class="d-green d-fill"/>
<text x="46" y="218" class="d-t" text-anchor="start" >Infohash</text>
<text x="176" y="218" class="d-s" text-anchor="start" >20 bytes</text>
<text x="366" y="218" class="d-s" text-anchor="end" >Which torrent</text>
</g>
<g data-node="peer">
<rect x="274.1" y="54" width="104.4" height="36" rx="2" class="d-rose d-fill" opacity="0.85"/>
<rect x="20" y="234" width="360" height="28" rx="6" class="d-box"/>
<circle cx="34" cy="248" r="4" class="d-rose d-fill"/>
<text x="46" y="252" class="d-t" text-anchor="start" >Peer ID</text>
<text x="176" y="252" class="d-s" text-anchor="start" >20 bytes</text>
<text x="366" y="252" class="d-s" text-anchor="end" >Who's talking</text>
</g>
</svg>
