<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-torrent-peers"><title id="t-torrent-peers">Your client asks a tracker or the DHT who is in the swarm. A seeder sends it pieces and a leecher trades with it. A newcomer gets an optimistic unchoke, and a free-rider stays choked</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-torrent-peers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<g data-node="tracker">
<rect x="10" y="16" width="180" height="50" rx="8" class="d-ext"/>
<text x="24" y="38" class="d-t" text-anchor="start" >Tracker</text>
<text x="24" y="54" class="d-s" text-anchor="start" >Lists the swarm's peers</text>
</g>
<g data-node="dht">
<rect x="210" y="16" width="180" height="50" rx="8" class="d-ext"/>
<text x="224" y="38" class="d-t" text-anchor="start" >DHT</text>
<text x="224" y="54" class="d-s" text-anchor="start" >Same lookup, no server</text>
</g>
<g data-node="seeder">
<rect x="10" y="106" width="112" height="50" rx="8" class="d-box"/>
<circle cx="24" cy="124" r="4" class="d-green d-fill"/>
<text x="36" y="128" class="d-t" text-anchor="start" >Seeder</text>
<text x="36" y="144" class="d-s" text-anchor="start" >Every piece</text>
</g>
<g data-node="leecher">
<rect x="278" y="106" width="112" height="50" rx="8" class="d-box"/>
<circle cx="292" cy="124" r="4" class="d-blue d-fill"/>
<text x="304" y="128" class="d-t" text-anchor="start" >Leecher</text>
<text x="304" y="144" class="d-s" text-anchor="start" >Trades pieces</text>
</g>
<g data-node="freerider">
<rect x="10" y="206" width="112" height="50" rx="8" class="d-box"/>
<circle cx="24" cy="224" r="4" class="d-rose d-fill"/>
<text x="36" y="228" class="d-t" text-anchor="start" >Free-rider</text>
<text x="36" y="244" class="d-s" text-anchor="start" >Never uploads</text>
</g>
<g data-node="newcomer">
<rect x="278" y="206" width="112" height="50" rx="8" class="d-box"/>
<circle cx="292" cy="224" r="4" class="d-amber d-fill"/>
<text x="304" y="228" class="d-t" text-anchor="start" >Newcomer</text>
<text x="304" y="244" class="d-s" text-anchor="start" >No pieces yet</text>
</g>
<g data-node="you">
<rect x="160" y="148" width="80" height="66" rx="8" class="d-box"/>
<text x="200.0" y="170" class="d-t" text-anchor="middle" >You</text>
<text x="200.0" y="186" class="d-s" text-anchor="middle" >Your client</text>
</g>
<path d="M180,148 L112,68" class="d-line" data-edge="you-tracker" marker-end="url(#ah-torrent-peers)"/>
<path d="M220,148 L288,68" class="d-line" data-edge="you-dht" marker-end="url(#ah-torrent-peers)"/>
<path d="M122,138 L158,168" class="d-line" data-edge="seeder-you" marker-end="url(#ah-torrent-peers)"/>
<path d="M240,166 L276,136" class="d-line" data-edge="you-leecher" marker-end="url(#ah-torrent-peers)"/>
<path d="M278,148 L242,178" class="d-line" data-edge="leecher-you" marker-end="url(#ah-torrent-peers)"/>
<path d="M240,196 L276,224" class="d-line" data-edge="you-newcomer" marker-end="url(#ah-torrent-peers)"/>
<path d="M160,194 L124,224" class="d-line d-faint" stroke-dasharray="4 3" data-edge="you-freerider" marker-end="url(#ah-torrent-peers)"/>
<text x="20" y="284" class="d-s" text-anchor="start" >Solid: pieces flow. Dashed: choked, so no upload from you.</text>
</svg>
