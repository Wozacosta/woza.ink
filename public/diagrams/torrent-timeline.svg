<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 396" role="img" aria-labelledby="t-torrent-timeline"><title id="t-torrent-timeline">A vertical timeline to scale from 2001 to 2017, beside the post's four phases. The protocol in 2001, the incentives paper in 2003, the Mainline DHT in 2005, BEPs 5, 9, 10 and 27 in 2008, BEP 29 in 2009, The Pirate Bay going magnet-only in 2012, and BEP 52 last revised in 2017</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-torrent-timeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >The dates behind the phases</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Years to scale</text>
<rect x="72" y="63" width="6" height="78" rx="2" class="d-green d-fill" opacity="0.85"/>
<text x="20" y="106.0" class="d-s" text-anchor="start" >Phase 1</text>
<rect x="72" y="143" width="6" height="58" rx="2" class="d-blue d-fill" opacity="0.85"/>
<text x="20" y="176.0" class="d-s" text-anchor="start" >Phase 2</text>
<rect x="72" y="203" width="6" height="78" rx="2" class="d-amber d-fill" opacity="0.85"/>
<text x="20" y="246.0" class="d-s" text-anchor="start" >Phase 3</text>
<rect x="72" y="283" width="6" height="109.99999999999818" rx="2" class="d-violet d-fill" opacity="0.85"/>
<text x="20" y="341.9999999999991" class="d-s" text-anchor="start" >Phase 4</text>
<line x1="78" y1="67" x2="90" y2="67" class="d-line d-faint"/>
<text x="96" y="71" class="d-s d-m" text-anchor="start" >2001</text>
<text x="132" y="71" class="d-s" text-anchor="start" >Bram Cohen sketches the protocol</text>
<line x1="78" y1="107" x2="90" y2="107" class="d-line d-faint"/>
<text x="96" y="111" class="d-s d-m" text-anchor="start" >2003</text>
<text x="132" y="111" class="d-s" text-anchor="start" >The incentives paper</text>
<line x1="78" y1="147" x2="90" y2="147" class="d-line d-faint"/>
<text x="96" y="151" class="d-s d-m" text-anchor="start" >2005</text>
<text x="132" y="151" class="d-s" text-anchor="start" >The Mainline DHT ships</text>
<line x1="78" y1="207" x2="90" y2="207" class="d-line d-faint"/>
<text x="96" y="211" class="d-s d-m" text-anchor="start" >2008</text>
<text x="132" y="211" class="d-s" text-anchor="start" >BEPs 5, 9, 10 and 27 are written</text>
<line x1="78" y1="227" x2="90" y2="227" class="d-line d-faint"/>
<text x="96" y="231" class="d-s d-m" text-anchor="start" >2009</text>
<text x="132" y="231" class="d-s" text-anchor="start" >BEP 29: uTP</text>
<line x1="78" y1="287" x2="90" y2="287" class="d-line d-faint"/>
<text x="96" y="291" class="d-s d-m" text-anchor="start" >2012</text>
<text x="132" y="291" class="d-s" text-anchor="start" >The Pirate Bay goes magnet-only</text>
<line x1="78" y1="387" x2="90" y2="387" class="d-line d-faint"/>
<text x="96" y="391" class="d-s d-m" text-anchor="start" >2017</text>
<text x="132" y="391" class="d-s" text-anchor="start" >BEP 52, BitTorrent v2, last revised</text>
</svg>
