<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" role="img" aria-labelledby="t-ux-aesthetic"><title id="t-ux-aesthetic">How easy people thought an ATM was tracked how attractive they found it more closely than it tracked how easy it actually was</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-ux-aesthetic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >What ease ratings really track</text>
<text x="20" y="38" class="d-s" text-anchor="start" >252 people rating 26 ATM layouts. Not to scale.</text>
<rect x="20" y="58" width="146" height="44" rx="8" class="d-box"/>
<circle cx="34" cy="80.0" r="4" class="d-violet d-fill"/>
<text x="46" y="84.5" class="d-t" text-anchor="start" >Attractive</text>
<rect x="20" y="136" width="146" height="44" rx="8" class="d-box"/>
<circle cx="34" cy="158.0" r="4" class="d-blue d-fill"/>
<text x="46" y="162.5" class="d-t" text-anchor="start" >Actually easy</text>
<rect x="244" y="97" width="136" height="44" rx="8" class="d-box"/>
<circle cx="258" cy="119.0" r="4" class="d-green d-fill"/>
<text x="270" y="123.5" class="d-t" text-anchor="start" >Seems easy</text>
<path d="M166,80 L242,112" class="d-line d-violet d-stroke" stroke-width="2.5" marker-end="url(#ah-ux-aesthetic)"/>
<path d="M166,158 L242,128" class="d-line d-faint" stroke-dasharray="4 3" marker-end="url(#ah-ux-aesthetic)"/>
<text x="216" y="82" class="d-s d-violet d-ct" text-anchor="start" >closely</text>
<text x="216" y="162" class="d-s" text-anchor="start" >less closely</text>
</svg>
