<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 246" role="img" aria-labelledby="t-ux-edges"><title id="t-ux-edges">Two screens. A menu floating inside a window can be overshot, so the pointer has to slow down. A menu bar on the screen edge can't be overshot, because the pointer stops at the edge</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-ux-edges" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Why the screen edge is so fast to hit</text>
<text x="20" y="52" class="d-s" text-anchor="start" >Inside a window</text>
<rect x="20" y="62" width="170" height="130" rx="4" class="d-box"/>
<rect x="40" y="112" width="130" height="18" rx="2" class="d-rose d-fill" opacity="0.8"/>
<circle cx="105" cy="178" r="4" class="d-blue d-fill"/>
<path d="M105,172 L105,84" class="d-line" marker-end="url(#ah-ux-edges)"/>
<text x="20" y="212" class="d-t" text-anchor="start" >Overshoot and you miss,</text>
<text x="20" y="230" class="d-s" text-anchor="start" >so you have to slow down</text>
<text x="210" y="52" class="d-s" text-anchor="start" >On the screen edge</text>
<rect x="210" y="62" width="170" height="130" rx="4" class="d-box"/>
<rect x="210" y="62" width="170" height="18" rx="2" class="d-green d-fill" opacity="0.85"/>
<circle cx="295" cy="178" r="4" class="d-blue d-fill"/>
<path d="M295,172 L295,66" class="d-line" marker-end="url(#ah-ux-edges)"/>
<text x="210" y="212" class="d-t" text-anchor="start" >Push as hard as you like:</text>
<text x="210" y="230" class="d-s" text-anchor="start" >the pointer stops at the edge</text>
</svg>
