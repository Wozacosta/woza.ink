<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" role="img" aria-labelledby="t-ux-fitts"><title id="t-ux-fitts">Three pointing tasks drawn to scale. A far, narrow target scores 4.0 bits. Making it three times wider, or bringing it three times closer, both score 2.6 bits</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-ux-fitts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Difficulty = log2(D / W + 1)</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Distances and widths to scale. Fewer bits means faster.</text>
<text x="20" y="72" class="d-s" text-anchor="start" >Far and narrow</text>
<text x="380" y="72" class="d-t d-rose d-ct" text-anchor="end" >4.0 bits</text>
<circle cx="30" cy="100" r="4" class="d-blue d-fill"/>
<rect x="320.0" y="83" width="20" height="34" rx="4" class="d-rose d-fill" opacity="0.85"/>
<path d="M38,100 L317.0,100" class="d-line" marker-end="url(#ah-ux-fitts)"/>
<text x="20" y="152" class="d-s" text-anchor="start" >Far and wide</text>
<text x="380" y="152" class="d-t d-green d-ct" text-anchor="end" >2.6 bits</text>
<circle cx="30" cy="180" r="4" class="d-blue d-fill"/>
<rect x="300.0" y="163" width="60" height="34" rx="4" class="d-green d-fill" opacity="0.85"/>
<path d="M38,180 L297.0,180" class="d-line" marker-end="url(#ah-ux-fitts)"/>
<text x="20" y="232" class="d-s" text-anchor="start" >Close and narrow</text>
<text x="380" y="232" class="d-t d-green d-ct" text-anchor="end" >2.6 bits</text>
<circle cx="30" cy="260" r="4" class="d-blue d-fill"/>
<rect x="120.0" y="243" width="20" height="34" rx="4" class="d-green d-fill" opacity="0.85"/>
<path d="M38,260 L117.0,260" class="d-line" marker-end="url(#ah-ux-fitts)"/>
</svg>
