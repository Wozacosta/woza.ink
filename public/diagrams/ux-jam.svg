<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" role="img" aria-labelledby="t-ux-jam"><title id="t-ux-jam">Of 100 passers-by, the table with 24 jams drew 60 and sold to about 2. The table with 6 jams drew 40 and sold to 12. A 2010 meta-analysis of 50 experiments and 5,036 people found a mean effect of virtually zero</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-ux-jam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >The jam study, per 100 passers-by</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Iyengar and Lepper, 2000</text>
<text x="20" y="66" class="d-t" text-anchor="start" >24 jams</text>
<rect x="20" y="74" width="240" height="16" rx="2" class="d-rose d-fill" opacity="0.3"/>
<text x="268" y="86" class="d-s" text-anchor="start" >60 stop</text>
<rect x="20" y="94" width="7.2" height="16" rx="2" class="d-rose d-fill"/>
<text x="35.2" y="106" class="d-s d-rose d-ct" text-anchor="start" >1.8 buy</text>
<text x="20" y="142" class="d-t" text-anchor="start" >6 jams</text>
<rect x="20" y="150" width="160" height="16" rx="2" class="d-green d-fill" opacity="0.3"/>
<text x="188" y="162" class="d-s" text-anchor="start" >40 stop</text>
<rect x="20" y="170" width="48" height="16" rx="2" class="d-green d-fill"/>
<text x="76" y="182" class="d-s d-green d-ct" text-anchor="start" >12 buy</text>
<line x1="20" y1="200" x2="380" y2="200" class="d-line d-faint"/>
<text x="20" y="224" class="d-t" text-anchor="start" >Ten years later: 50 experiments, 5,036 people</text>
<text x="20" y="242" class="d-s" text-anchor="start" >Mean effect of more options: virtually zero</text>
</svg>
