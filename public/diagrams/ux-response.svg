<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-labelledby="t-ux-response"><title id="t-ux-response">A log scale of response times. 0.1 seconds feels instant, 400 milliseconds is the Doherty threshold, 1 second keeps a train of thought, 2 seconds was the old idea of fast enough, and 10 seconds is where attention goes</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-ux-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Response time, on a log scale</text>
<text x="20" y="38" class="d-s" text-anchor="start" >Doherty's number among the classic limits</text>
<line x1="30.0" y1="112" x2="370.0" y2="112" class="d-line"/>
<circle cx="30.0" cy="112" r="5" class="d-green d-fill"/>
<text x="30.0" y="78" class="d-t d-green d-ct" text-anchor="start" >0.1 s</text>
<text x="30.0" y="94" class="d-s" text-anchor="start" >feels instant</text>
<circle cx="132.4" cy="112" r="5" class="d-amber d-fill"/>
<text x="132.4" y="140" class="d-t d-amber d-ct" text-anchor="middle" >0.4 s</text>
<text x="132.4" y="156" class="d-s" text-anchor="middle" >Doherty's budget</text>
<circle cx="200.0" cy="112" r="5" class="d-blue d-fill"/>
<text x="200.0" y="78" class="d-t d-blue d-ct" text-anchor="middle" >1 s</text>
<text x="200.0" y="94" class="d-s" text-anchor="middle" >train of thought holds</text>
<circle cx="251.2" cy="112" r="5" class="d-rose d-fill"/>
<text x="251.2" y="140" class="d-t d-rose d-ct" text-anchor="middle" >2 s</text>
<text x="251.2" y="156" class="d-s" text-anchor="middle" >1982's "fast enough"</text>
<circle cx="370.0" cy="112" r="5" class="d-rose d-fill"/>
<text x="370.0" y="78" class="d-t d-rose d-ct" text-anchor="end" >10 s</text>
<text x="370.0" y="94" class="d-s" text-anchor="end" >attention goes</text>
</svg>
