<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 276" role="img" aria-labelledby="t-worktree-keystrokes"><title id="t-worktree-keystrokes">Characters to type for each task in the comparison table, to scale. worktrunk needs 17, 27 and 9 characters. Plain git needs 56, 66 and 68</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
