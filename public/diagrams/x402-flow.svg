<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" role="img" aria-labelledby="t-x402-flow"><title id="t-x402-flow">The agent requests a resource and gets 402 Payment Required with the price, token and chain. It retries with a signed payment, the server or a facilitator checks it settled onchain, and the resource comes back</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-x402-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<rect x="20" y="16" width="110" height="36" rx="8" class="d-box"/>
<text x="75.0" y="38.5" class="d-t" text-anchor="middle" >Agent</text>
<rect x="270" y="16" width="110" height="36" rx="8" class="d-box"/>
<text x="325.0" y="38.5" class="d-t" text-anchor="middle" >Server</text>
<line x1="75" y1="52" x2="75" y2="298" class="d-line d-faint" stroke-dasharray="4 3"/>
<line x1="325" y1="52" x2="325" y2="298" class="d-line d-faint" stroke-dasharray="4 3"/>
<path d="M77,100 L322,100" class="d-line" marker-end="url(#ah-x402-flow)"/>
<text x="200" y="92" class="d-t d-m" text-anchor="middle" >GET /api/weather</text>
<path d="M323,156 L78,156" class="d-line" marker-end="url(#ah-x402-flow)"/>
<text x="200" y="135" class="d-t d-m" text-anchor="middle" >402 Payment Required</text>
<text x="200" y="149" class="d-s" text-anchor="middle" >PAYMENT-REQUIRED: price, token, chain</text>
<path d="M77,212 L322,212" class="d-line" marker-end="url(#ah-x402-flow)"/>
<text x="200" y="191" class="d-t d-m" text-anchor="middle" >GET /api/weather</text>
<text x="200" y="205" class="d-s" text-anchor="middle" >PAYMENT-SIGNATURE: the signed payment</text>
<path d="M323,286 L78,286" class="d-line" marker-end="url(#ah-x402-flow)"/>
<text x="200" y="278" class="d-t d-m" text-anchor="middle" >200 and the resource</text>
<text x="317" y="240" class="d-s d-amber d-ct" text-anchor="end" >Server or facilitator checks</text>
<text x="317" y="255" class="d-s d-amber d-ct" text-anchor="end" >that it settled onchain</text>
</svg>
