<rect x="106" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="122" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="138" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="154" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="170" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="186" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="202" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="218" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="234" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="250" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<rect x="266" y="220" width="10" height="14" rx="2" class="d-amber d-fill" opacity="0.8"/>
<path d="M292,227 H326" class="d-line"/>
<circle cx="340" cy="227" r="9" class="d-green d-fill" opacity="0.85"/>
<rect x="20" y="290" width="160" height="26" rx="4" class="d-blue d-fill" opacity="0.3"/>
<rect x="182" y="290" width="198" height="26" rx="4" class="d-amber d-fill" opacity="0.25"/>
<text x="100" y="308" class="d-s" text-anchor="middle" >captured</text>
<text x="281" y="308" class="d-s" text-anchor="middle" >released to the client</text>
</svg>
