<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" role="img" aria-labelledby="t-zcash-proofs"><title id="t-zcash-proofs">Zcash's proving systems on a timeline to scale. Sprout launched in October 2016 with BCTV14. Sapling moved to Groth16 in October 2018. Both need a trusted setup. Orchard, activated in 2022, uses Halo 2, which needs none</title>
<style>
.d-box{fill:var(--surface,#f1ede6);stroke:var(--line-strong,#cfc8bc);stroke-width:1}
.d-ext{fill:none;stroke:var(--line-strong,#cfc8bc);stroke-width:1;stroke-dasharray:4 3}
.d-t{fill:var(--foreground,#1a1a1a);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600}
.d-s{fill:var(--subtle,#6b665f);font-family:var(--font-inter,Inter),system-ui,-apple-system,sans-serif;font-size:11px}
.d-m{font-family:var(--font-mono,ui-monospace),Menlo,monospace;font-size:10.5px}
.d-line{stroke:var(--subtle,#6b665f);stroke-width:1.25;fill:none}
.d-faint{stroke:var(--line-strong,#cfc8bc)}
.d-head{fill:var(--subtle,#6b665f)}
.d-violet{--c:var(--d-violet,#6d28d9)}.d-blue{--c:var(--d-blue,#1d4ed8)}.d-amber{--c:var(--d-amber,#92400e)}
.d-green{--c:var(--d-green,#047857)}.d-rose{--c:var(--d-rose,#be123c)}
.d-fill{fill:var(--c)}.d-stroke{stroke:var(--c)}.d-ct{fill:var(--c)}
</style>
<defs><marker id="ah-zcash-proofs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
<text x="20" y="22" class="d-t" text-anchor="start" >Three proving systems, the last with no setup</text>
<text x="20" y="38" class="d-s" text-anchor="start" >To scale from Zcash's launch</text>
<rect x="20.0" y="56" width="90.2" height="44" rx="3" class="d-rose d-fill" opacity="0.8"/>
<text x="28.0" y="74" class="d-t" text-anchor="start" style="fill:var(--background,#faf8f5)">Sprout</text>
<text x="28.0" y="90" class="d-s" text-anchor="start" style="fill:var(--background,#faf8f5)">BCTV14</text>
<rect x="112.2" y="56" width="160.9" height="44" rx="3" class="d-amber d-fill" opacity="0.8"/>
<text x="120.2" y="74" class="d-t" text-anchor="start" style="fill:var(--background,#faf8f5)">Sapling</text>
<text x="120.2" y="90" class="d-s" text-anchor="start" style="fill:var(--background,#faf8f5)">Groth16</text>
<rect x="275.2" y="56" width="102.8" height="44" rx="3" class="d-green d-fill" opacity="0.8"/>
<text x="283.2" y="74" class="d-t" text-anchor="start" style="fill:var(--background,#faf8f5)">Orchard</text>
<text x="283.2" y="90" class="d-s" text-anchor="start" style="fill:var(--background,#faf8f5)">Halo 2</text>
<text x="20.0" y="116" class="d-s" text-anchor="start" >Oct 2016</text>
<text x="112.2" y="116" class="d-s" text-anchor="middle" >Oct 2018</text>
<text x="275.2" y="116" class="d-s" text-anchor="middle" >2022</text>
<path d="M20.0,128 L20.0,134 L273.2,134 L273.2,128" class="d-line d-rose d-stroke"/>
<text x="147.6" y="150" class="d-s d-rose d-ct" text-anchor="middle" >Trusted setup, with toxic waste to discard</text>
<path d="M277.2,128 L277.2,134 L380,134 L380,128" class="d-line d-green d-stroke"/>
<text x="380" y="150" class="d-s d-green d-ct" text-anchor="end" >No setup</text>
<text x="20" y="182" class="d-s" text-anchor="start" >The axis stops at 2024 for space. Orchard is still current.</text>
</svg>
